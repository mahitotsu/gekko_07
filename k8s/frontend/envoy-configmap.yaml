# frontend ingress+egress側Envoy設定(edge-proxy配線・簡易ログイン検証用。ADR 0009/0024)。
#
# frontendは唯一、mTLSを持てない外部クライアント(ブラウザ)の代役を務める入口であり、他の
# 内部サービス間ホップとはingressの形が異なる。呼び出し元は常にedge-proxy(mTLS、ブラウザの
# 生トラフィックを中継するだけ)で、edge-proxyからのリクエスト自体にはKeycloak発行JWTが
# 乗っていない(/loginはログイン前なので当然、それ以外もセッションはCookie相当の概念で
# 保持する想定のため)。今回の簡易ログインでは、ログイン後の呼び出し(/accounts/... ・/chat)は
# 呼び出し元(verify-hop.sh。将来のブラウザ相当)がログイントークンをAuthorizationヘッダーで
# そのまま持ち回る形にしたため、jwt_authnは/login以外のパスにのみ要求する(mixed
# requirement)。scopeによる差別化は行わない(ログイントークンはscopeをほとんど持たないため。
# access-control-design.md参照)——実際の認可はaccount-service/fraud-agent側の受け側で行う。
# そのためrbacフィルタは付けない。
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    node:
      id: frontend-envoy
      cluster: frontend
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: ["h2"]
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/edge-proxy"
                      validation_context_sds_secret_config:
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    # 監査ログ集約(ADR 0025)。sub/scope/jtiはjwt_authnがこのリクエストに
                    # 実ヘッダーとして注入済み(claim_to_headers)のため、access_logからも
                    # %REQ(...)%でそのまま参照できる(/loginはjwt_authn免除のため空文字列)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: frontend
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: app_upstream }
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              issuer: "http://localhost:3000/realms/gekko"
                              audiences: ["frontend"]
                              remote_jwks:
                                http_uri:
                                  uri: "https://keycloak.gekko.svc.cluster.local:8443/realms/gekko/protocol/openid-connect/certs"
                                  cluster: keycloak_jwks
                                  timeout: 5s
                                cache_duration: 300s
                              forward: true
                              claim_to_headers:
                                - header_name: "x-auth-sub"
                                  claim_name: "sub"
                                - header_name: "x-auth-scope"
                                  claim_name: "scope"
                                - header_name: "x-auth-jti"
                                  claim_name: "jti"
                          rules:
                            # /loginはログイン前なのでJWTを要求しない(順序が重要。prefix "/"より
                            # 先に置く)。それ以外は全てaud=frontendのログイントークンを要求する。
                            - match: { path: "/login" }
                            - match: { prefix: "/" }
                              requires: { provider_name: "keycloak" }
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              -- 全パス一律で合言葉を付与する(rbacフィルタが無いため、ここでの
                              -- 「後段」はjwt_authnの後という意味になる。ADR 0009 §2③)。
                              function envoy_on_request(request_handle)
                                local token = os.getenv("HANDSHAKE_TOKEN")
                                if token then
                                  request_handle:headers():replace("x-gekko-handshake", token)
                                end
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # frontend→account-service/fraud-agent向けegressリスナー(ADR 0019/0020/0023と同じ
        # パターン)。hostAliasesで"account-service"・"fraud-agent"・"keycloak"を127.0.0.1へ
        # 横取りし、appからのリクエストとtoken-exchangeサイドカー自身のKeycloak向けリクエストの
        # 両方をこのリスナーで受け止める。
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    # 監査ログ集約(ADR 0025)。egress側にjwt_authnは無いため、appがx-auth-*を
                    # 転送しない限りsub/scope/jtiは空文字列になる(Token Exchange自体の相関は
                    # Keycloakのイベントログ側で追う)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: account_service
                          domains: ["account-service"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: account_service_upstream }
                        - name: fraud_agent
                          domains: ["fraud-agent"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: fraud_agent_upstream }
                        # token-exchangeサイドカー自身がKeycloakのトークンエンドポイントを叩く際の
                        # 宛先(ログインのROPCも含む)。http_filtersはリスナー全体に適用されるため、
                        # このルートだけext_authzを無効化しないと、サイドカー自身のKeycloak宛て
                        # 通信が自己参照的にext_authzへ回されてしまう(ADR 0019で判明した問題と同じ)。
                        - name: keycloak
                          domains: ["keycloak"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak_upstream }
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://127.0.0.1:9002"
                              cluster: token_exchange_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: app_upstream
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: app_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9000 }
        - name: keycloak_jwks
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        # egressリスナーのアップストリーム(account-service向け)。SPIRE発行のSVIDによる
        # mTLS+ALPN h2。account-service側のingressにもfrontendのSPIFFE IDを許可リストへ
        # 追加している(k8s/account-service/envoy-configmap.yaml参照)。
        - name: account_service_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/account-service"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: account_service_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: account-service.gekko.svc.cluster.local, port_value: 8080 }
        # egressリスナーのアップストリーム(fraud-agent向け、ADR 0023でSAN許可リストに
        # frontendが先回りして登録済み)。
        - name: fraud_agent_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-agent"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: fraud_agent_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: fraud-agent.gekko.svc.cluster.local, port_value: 8080 }
        # token-exchangeサイドカー(同一Pod、loopback)。app_upstreamと同じ信頼境界のため
        # plaintextでよい(mTLS不要。ADR 0019と同じ考え方)。
        - name: token_exchange_cluster
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: token_exchange_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9002 }
        # token-exchangeサイドカーがKeycloakのトークンエンドポイントへmTLSで直接接続する
        # (keycloak_jwksクラスタと宛先は同じだが、用途を分けて別クラスタにしてある。
        # ADR 0019のkeycloak_upstreamと同じ構成)。
        - name: keycloak_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
