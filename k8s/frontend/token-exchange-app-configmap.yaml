# frontend自身のPod内でログイン(ROPC)とToken Exchangeの両方を実行するサイドカー(ADR 0024)。
# ADR 0002の原則(アプリ本体にはKeycloak通信・Token Exchangeのコードを一切持たせない)を、
# ログイン部分にも一貫して適用する——appはこのサイドカーへ中継するだけで、Keycloakへの
# 直接通信・SPIRE JWT-SVIDへのアクセスはこのサイドカー(spire-agent-socketをマウントする
# 唯一のコンテナの1つ)が担う。
#
# 2つの役割を1つのHTTPサーバーに同居させている:
#   - POST /login       : frontend appから直接(Envoyを経由せず127.0.0.1で)呼ばれる。ROPC
#                          (grant_type=password)でKeycloakへログインし、ログイントークン
#                          (aud=frontend)を返す。本実装のAuthorization Code + PKCEの代用
#                          (ADR 0024。directAccessGrantsEnabledをrealm-configmap.yamlで
#                          恒久的にtrueにした)
#   - それ以外(/accounts/... 等) : Envoyのegress ext_authzフィルタからのcheck-request。
#                          account-service(ADR 0019/0020/0021)・fraud-mcp-server(ADR 0023)の
#                          token-exchangeサイドカーと同じHTTPベースのext_authzプロトコル
#
# scope解決はfraud-mcp-serverのSCOPE_RULES方式(access-control-design.md 表2のコード化)を
# 踏襲しつつ、frontendは2つの異なるaudience(account-service・fraud-agent)へ委任するため、
# hostも解決キーに含める。
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-token-exchange-app
  namespace: gekko
data:
  app.py: |
    import base64
    import http.server
    import json
    import os
    import re
    import socketserver
    import subprocess
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    TOKEN_URL = os.environ.get(
        "KEYCLOAK_TOKEN_URL",
        "http://keycloak/realms/gekko/protocol/openid-connect/token",
    )
    CLIENT_ID = os.environ.get("CLIENT_ID", "frontend")
    # JWT-SVIDのaudクレームに求める値。KeycloakのSPIFFE federated-jwt認証はaud/iss検証ではなく
    # sub(SPIFFE ID)とKeycloakクライアント属性jwt.credential.subの一致だけを見る(実機確認済み。
    # k8s/fraud-mcp-server/token-exchange-app-configmap.yaml参照)。
    JWT_SVID_AUDIENCE = os.environ.get("JWT_SVID_AUDIENCE", "http://localhost:3000/realms/gekko")
    SPIRE_AGENT_BIN = os.environ.get("SPIRE_AGENT_BIN", "/spire-bin/opt/spire/bin/spire-agent")
    SPIRE_SOCKET_PATH = os.environ.get("SPIRE_SOCKET_PATH", "/run/spire/sockets/agent.sock")
    LISTEN_HOST = os.environ.get("LISTEN_HOST", "127.0.0.1")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "9002"))

    # access-control-design.md 表2をそのまま反映した(host, path, method) -> scope の対応表。
    # frontend→account-serviceはpathでscopeが変わる(読み取り/確定操作)、frontend→fraud-agent
    # はscopeが1つだけ(チャット開始)。
    SCOPE_RULES = [
        ("account-service", re.compile(r"^/accounts/[^/]+/unfreeze$"), "POST", "account:unfreeze"),
        ("account-service", re.compile(r"^/accounts/[^/]+(/.*)?$"), "GET", "account:read"),
        ("fraud-agent", re.compile(r"^/chat$"), "POST", "account:read"),
    ]


    def resolve_scope(host, path, method):
        for expected_host, pattern, expected_method, scope in SCOPE_RULES:
            if host == expected_host and method == expected_method and pattern.match(path):
                return scope
        return None


    def _b64url_decode(s):
        s += "=" * (-len(s) % 4)
        return base64.urlsafe_b64decode(s)


    _jwt_svid_cache = {"token": None, "expires_at": 0.0}


    def fetch_jwt_svid():
        # SPIRE発行JWT-SVIDの既定TTLは短い(実機で5分)ため、期限手前で切り上げて再取得する。
        now = time.monotonic()
        if _jwt_svid_cache["token"] and now < _jwt_svid_cache["expires_at"]:
            return _jwt_svid_cache["token"]
        out = subprocess.run(
            [
                SPIRE_AGENT_BIN, "api", "fetch", "jwt",
                "-audience", JWT_SVID_AUDIENCE,
                "-output", "json",
                "-socketPath", SPIRE_SOCKET_PATH,
            ],
            capture_output=True, timeout=5, check=True,
        )
        body = json.loads(out.stdout)
        token = body[0]["svids"][0]["svid"]
        payload = json.loads(_b64url_decode(token.split(".")[1]))
        _jwt_svid_cache["token"] = token
        _jwt_svid_cache["expires_at"] = now + max(payload["exp"] - payload["iat"] - 10, 5)
        return token


    def ropc_login(username, password):
        data = urllib.parse.urlencode(
            {
                "grant_type": "password",
                "client_id": CLIENT_ID,
                "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-spiffe",
                "client_assertion": fetch_jwt_svid(),
                "username": username,
                "password": password,
            }
        ).encode()
        req = urllib.request.Request(
            TOKEN_URL, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"}
        )
        with urllib.request.urlopen(req, timeout=5) as resp:
            return json.loads(resp.read())


    def exchange_token(subject_token, audience, scope):
        data = urllib.parse.urlencode(
            {
                "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                "client_id": CLIENT_ID,
                "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-spiffe",
                "client_assertion": fetch_jwt_svid(),
                "subject_token": subject_token,
                "subject_token_type": "urn:ietf:params:oauth:token-type:access_token",
                "audience": audience,
                "scope": scope,
            }
        ).encode()
        req = urllib.request.Request(
            TOKEN_URL, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"}
        )
        with urllib.request.urlopen(req, timeout=5) as resp:
            return json.loads(resp.read())["access_token"]


    class Handler(http.server.BaseHTTPRequestHandler):
        def deny(self, code, msg):
            print(f"DENY {code}: {msg}", file=sys.stderr, flush=True)
            self.send_response(code)
            self.end_headers()

        def do_login(self):
            length = int(self.headers.get("Content-Length", 0) or 0)
            try:
                payload = json.loads(self.rfile.read(length)) if length else {}
                username = payload["username"]
                password = payload["password"]
            except Exception:  # noqa: BLE001 - スタブなので広く捕捉してfail closeする
                self.deny(400, "invalid login request body")
                return
            try:
                token_response = ropc_login(username, password)
            except urllib.error.HTTPError as e:
                self.deny(401, f"login rejected: {e.code} {e.read()!r}")
                return
            except Exception as e:  # noqa: BLE001
                self.deny(401, f"login failed: {e!r}")
                return
            body = json.dumps({"access_token": token_response["access_token"]}).encode()
            print(f"ALLOW login username={username}", flush=True)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_check(self):
            # Envoyが自動転送するHost/Method/Path/Authorizationヘッダーを優先し、
            # 無ければ実際のリクエストラインにフォールバックする(k8s/fraud-mcp-server/
            # token-exchange-app-configmap.yamlと同じ考え方)。
            host = self.headers.get("Host")
            method = self.headers.get("Method") or self.command
            path = self.headers.get("Path") or self.path

            auth = self.headers.get("Authorization")
            if not host or not auth or not auth.startswith("Bearer "):
                self.deny(400, "missing host/authorization")
                return

            scope = resolve_scope(host, path, method)
            if not scope:
                self.deny(403, f"no scope mapping for {method} {path} (host={host})")
                return

            subject_token = auth[len("Bearer ") :]
            try:
                new_token = exchange_token(subject_token, host, scope)
            except urllib.error.HTTPError as e:
                self.deny(403, f"token exchange rejected: {e.code} {e.read()!r}")
                return
            except Exception as e:  # noqa: BLE001 - スタブなので広く捕捉してfail closeする
                self.deny(403, f"token exchange failed: {e!r}")
                return

            print(f"ALLOW {method} {path} aud={host} scope={scope}", flush=True)
            self.send_response(200)
            self.send_header("Authorization", f"Bearer {new_token}")
            self.end_headers()

        def do_dispatch(self):
            if self.path == "/login":
                self.do_login()
            else:
                self.do_check()

        do_GET = do_dispatch
        do_POST = do_dispatch
        do_PUT = do_dispatch
        do_DELETE = do_dispatch

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        srv = Server((LISTEN_HOST, LISTEN_PORT), Handler)
        print(f"token-exchange sidecar listening on {LISTEN_HOST}:{LISTEN_PORT}", flush=True)
        srv.serve_forever()
