# frontendの本実装Deployment(TypeScript/Nuxt.js。ADR 0002/0007/0009/0010/0024/0031)。
# 他の本実装サービス(fraud-agent-stub→fraud-agent等)が辿ったのと同じ昇格：Deployment名を
# frontend-stub→frontendへリネームし、appコンテナのみビルド済みイメージへ置き換えた。
# initContainers(handshake-init・envoyのネイティブsidecar)・token-exchangeサイドカーは
# 構成は無変更(token-exchange側のロジックはADR 0031でROPC→Authorization Code+PKCEへ変更済み。
# k8s/frontend/token-exchange-app-configmap.yaml参照)。
#
# hostAliasesで"account-service"・"fraud-agent"・"audit-service"(ADR 0042で追加)・
# "keycloak"を127.0.0.1へマッピングする(ADR 0024のegressパターン)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gekko
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["account-service", "fraud-agent", "audit-service", "keycloak"]
      initContainers:
        # ADR 0009 §2③:Pod内合言葉。initContainerの完了がメインコンテナ起動前に保証されるため、
        # 「先に生成、後で両方が読む」がレースコンディションなく書ける。
        - name: handshake-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - "head -c32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /handshake/token"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
        # ネイティブsidecar(restartPolicy: Always。K8s 1.29+でGA、ADR 0028のdb-init Jobと同じ
        # パターン)。frontendはPostgresを持たないためwait-for-X initContainerは不要だが、
        # account-service等と構成を揃えるため、通常のcontainersからここへ昇格した(Serviceの
        # targetport(http)解決・NetworkPolicyのポートマッチングはcontainersと同様に機能する)。
        - name: envoy
          restartPolicy: Always
          image: envoyproxy/envoy:v1.31.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HANDSHAKE_TOKEN="$(cat /handshake/token)"
              exec envoy -c /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: handshake
              mountPath: /handshake
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      containers:
        - name: app
          image: gekko07/frontend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: "127.0.0.1" # ADR 0009 主対策①:Pod外から直接到達不能にする
            - name: PORT
              value: "9000"
            - name: HANDSHAKE_TOKEN_FILE
              value: "/handshake/token"
            - name: TOKEN_EXCHANGE_URL
              value: "http://127.0.0.1:9002"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service"
            - name: FRAUD_AGENT_URL
              value: "http://fraud-agent"
            # Authorization Code+PKCEのredirect_uri・Keycloak認可エンドポイントの組み立てに使う
            # (ADR 0031)。token-exchangeサイドカーのJWT_SVID_AUDIENCEと同じlocalhost:3000前提
            # (make keycloak-forwardでのport-forward先、ADR 0004)。
            - name: EDGE_PROXY_BASE_URL
              value: "http://localhost:3000"
            - name: OIDC_ISSUER
              value: "http://localhost:3000/realms/gekko"
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/certs"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        # ログイン(認可コード→トークン交換)とToken Exchangeの実行主体。envoyコンテナと同じく
        # Workload API UDSソケットへアクセスする(JWT-SVID取得のため)。SPIRE registration entry
        # もenvoyコンテナと並んでこのコンテナ名をselectorに持つ(k8s/spire/entries-configmap.yaml
        # 参照。ADR 0019/0020/0021/0023と同じパターン)。
        - name: token-exchange
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: CLIENT_ID
              value: "frontend"
            - name: JWT_SVID_AUDIENCE
              value: "http://localhost:3000/realms/gekko"
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "9002"
            - name: KEYCLOAK_TOKEN_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/token"
          volumeMounts:
            - name: token-exchange-app-script
              mountPath: /scripts
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Kubernetes ImageVolume(1.33+ Beta)でspire-agentイメージから`spire-agent`
            # CLIバイナリだけを読み取り専用マウントする(ADR 0019と同じ理由。distroless系
            # イメージでシェルが無くコピーもできないため)。
            - name: spire-agent-bin
              mountPath: /spire-bin
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: token-exchange-app-script
          configMap:
            name: frontend-token-exchange-app
        - name: envoy-config
          configMap:
            name: frontend-envoy
        - name: handshake
          emptyDir: {}
        - name: spire-agent-bin
          image:
            reference: ghcr.io/spiffe/spire-agent:1.15.3
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
