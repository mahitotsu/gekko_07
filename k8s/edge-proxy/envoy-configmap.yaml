# edge-proxyのEnvoy設定(ADR 0017)。外部(port-forward)からの平文接続を受け、Keycloak/frontend
# へはSPIRE発行のSVIDによるmTLS+ALPN h2で転送する。keycloak_upstreamクラスタは
# k8s/ext-authz/envoy-configmap.yamlの同名クラスタと同一構成(呼び出し元が異なるだけ)。
#
# ADR 0024:frontend実装にあわせてroute_configをパスベースで分割した。`/realms/`配下(Keycloakの
# OIDCエンドポイント。Authorization Code + PKCE(ADR 0031)・Token Exchangeのいずれも配下)・
# `/admin/`配下(Keycloak Admin REST API)・`/resources/`配下(ログインテーマの静的CSS/JS/画像)
# はkeycloak_upstreamへ、それ以外は新設のfrontend_upstreamへ。keycloak向けルートを先に置く
# 必要がある(Envoyのroute matchは列挙順で最初にマッチしたものが勝つため、後段のcatch-all
# "/"より前)。
#
# `/admin/`・`/resources/`はいずれもADR 0024策定時の想定漏れで、catch-allにマッチして
# frontendへ誤配送されていた(前者はkcadm.shの401、後者はログイン画面のスタイル欠落として
# 顕在化。詳細はinsights.md参照)。edge-proxyの役割自体(Keycloakへの非mTLS外部窓口)は
# 変わらないため、いずれも新規ADRは起こさずこの場でroute_configを修正した。
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    node:
      id: edge-proxy-envoy
      cluster: edge-proxy
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    # 監査ログ集約(ADR 0025)。edge-proxyはjwt_authnを持たない(認証前の
                    # Keycloak/frontendへの単純な経路分割のみ)ため、sub/scope/jtiは空文字列に
                    # なる。HTTPレベルの疎通記録としてのみ使う(相関キーは持たない)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: edge
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/realms/" }
                              route: { cluster: keycloak_upstream }
                            - match: { prefix: "/admin/" }
                              route: { cluster: keycloak_upstream }
                            # ログインテーマの静的アセット(CSS/JS/画像)。上部コメント・insights.md参照。
                            - match: { prefix: "/resources/" }
                              route: { cluster: keycloak_upstream }
                            # ADR 0030:frontend→fraud-agentの/chatはAG-UIプロトコルのSSE
                            # ストリーム(実行時間が不定長)を返す。総時間の上限ではなく無活動
                            # 時間の上限(idle_timeout)で制御する方式にした(login/accounts等
                            # 即時応答するリクエストにも同じ設定を使うが、idle_timeoutは実際に
                            # 無活動が続いた場合のみ働くため害はない)。
                            - match: { prefix: "/" }
                              route: { cluster: frontend_upstream, timeout: 0s, idle_timeout: 300s }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: keycloak_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # ADR 0024: frontend向けクラスタ(SPIRE発行のSVIDによるmTLS+ALPN h2)。
        - name: frontend_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/frontend"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: frontend_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: frontend.gekko.svc.cluster.local, port_value: 8080 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012/0016/0017)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
