# ADR 0018。ingressはtest-fixtures Job・analyst-attribute-service-seed Job(いずれもkcadm.sh、
# ADR 0026)とkubectl port-forward(ノードIP経由、ADR 0004)からのみ許可する。egressはKeycloakの
# mTLSポートと、frontend(ADR 0024)のみ。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-proxy
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: edge-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: keycloak-test-fixtures
        - podSelector:
            matchLabels:
              app: analyst-attribute-service-seed
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
