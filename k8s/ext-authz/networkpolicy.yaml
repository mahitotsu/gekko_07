# ADR 0018。呼び出し元ごとに固定資格情報を持つ別インスタンス構成(ext-authz-service-cc=
# fraud-detection-engine固定)に合わせ、それぞれ対応する呼び出し元からのingressのみを許可する。
# fraud-mcp-server用のインスタンス(ext-authz-service)はADR 0019でfraud-mcp-server自身の
# Pod内サイドカーへ置き換えたため廃止した(k8s/fraud-mcp-server/networkpolicy.yaml参照)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ext-authz-service-cc
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: ext-authz-service-cc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fraud-detection-engine
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
