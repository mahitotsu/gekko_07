# ext_authzサービス(ADR 0002)のclient_credentials専用インスタンス。
# fraud-detection-engine→account-service(ADR 0010パターン②)のみを対象にする。
# app.py本体はdeployment.yamlのToken Exchange用インスタンスと同一(ext-authz-app ConfigMap)で、
# GRANT_TYPE環境変数で挙動を分ける。
#
# ADR 0016でEnvoyサイドカーを追加(deployment.yamlと同じ構成。詳細はそちらのコメント参照)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-authz-service-cc
  namespace: gekko
  labels:
    app: ext-authz-service-cc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-authz-service-cc
  template:
    metadata:
      labels:
        app: ext-authz-service-cc
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["keycloak"]
      containers:
        - name: ext-authz
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: GRANT_TYPE
              value: "client_credentials"
            - name: CLIENT_ID
              value: "fraud-detection-engine"
            - name: CLIENT_SECRET_FILE
              value: "/secrets/client-secret"
            - name: FIXED_SCOPE
              value: "account:freeze"
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "9000"
            - name: KEYCLOAK_TOKEN_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/token"
          volumeMounts:
            - name: app-script
              mountPath: /scripts
              readOnly: true
            - name: client-secret
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        - name: envoy
          image: envoyproxy/envoy:v1.31.5
          command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012/0016)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      volumes:
        - name: app-script
          configMap:
            name: ext-authz-app
        - name: client-secret
          secret:
            secretName: fraud-detection-engine-client
        - name: envoy-config
          configMap:
            name: ext-authz-cc-envoy
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
