# ext_authzサービス(ADR 0002)のclient_credentials専用インスタンス。
# fraud-detection-engine→account-service(ADR 0010パターン②)のみを対象にする。
# app.py本体はdeployment.yamlのToken Exchange用インスタンスと同一(ext-authz-app ConfigMap)で、
# GRANT_TYPE環境変数で挙動を分ける。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-authz-service-cc
  namespace: gekko
  labels:
    app: ext-authz-service-cc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-authz-service-cc
  template:
    metadata:
      labels:
        app: ext-authz-service-cc
    spec:
      containers:
        - name: ext-authz
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: GRANT_TYPE
              value: "client_credentials"
            - name: CLIENT_ID
              value: "fraud-detection-engine"
            - name: CLIENT_SECRET_FILE
              value: "/secrets/client-secret"
            - name: FIXED_SCOPE
              value: "account:freeze"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app-script
              mountPath: /scripts
              readOnly: true
            - name: client-secret
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: app-script
          configMap:
            name: ext-authz-app
        - name: client-secret
          secret:
            secretName: fraud-detection-engine-client
