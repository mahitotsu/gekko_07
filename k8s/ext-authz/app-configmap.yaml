# ext_authzサービス本体(ADR 0002)。architecture.md §3のPod構成(initContainer＋app＋Envoy)に
# ext_authzは含まれないため、各サービスのサイドカーではなくクラスタで共有する独立サービスとして
# 実装する。Dockerfileは書かず、Keycloakのdb-init-*と同じパターン(ConfigMapのスクリプトをstock
# イメージへcommandでマウント実行)にする。
#
# Envoyのext_authz(HTTPモード)は、外部認可サーバーへのチェックリクエストに
# Host/Method/Path/Content-Length/Authorizationを常に自動転送する(allowed_headersの設定とは
# 無関係。Envoy公式v3 APIリファレンスで確認済み。ADR 0010の実機検証で判明し同ADRを訂正した)。
# ExtAuthzPerRouteのcontext_extensionsはgRPCモード限定でHTTPモードには一切伝わらないため使わない。
# 本サービスは、この自動転送されるHost(=audience)とPath+Method(=access-control-design.md 表2の
# 対応表で解決するscope)だけからToken Exchangeリクエストを組み立てる。
#
# 1ホップ先行検証はfraud-mcp-server→account-service(Token Exchange)に加え、
# fraud-detection-engine→account-service(client_credentials、ADR 0010パターン②)も対象にする。
# 呼び出し元ごとに資格情報を切り替える一般化(複数呼び出し元を1インスタンスで捌く)はまだ行わず、
# 本ConfigMapのapp.pyをGRANT_TYPE環境変数で分岐させた上で、呼び出し元ごとに固定資格情報を持つ
# 別インスタンスとしてデプロイする(k8s/ext-authz/deployment.yaml=token-exchange固定、
# k8s/ext-authz/deployment-client-credentials.yaml=client_credentials固定)。呼び出し元の
# 動的な切り替えそのものは引き続き横展開時の課題(backlog.md参照)。
#
# DPoP(ADR 0013)による送信者拘束は一度実装・検証したが、このホップは既にSPIRE mTLS(ADR 0012)で
# 呼び出し元の身元を限定済みのため実利がmTLSと大きく重複する一方、Token Exchangeを跨いだ拘束は
# チェーンの終端ホップにしか置けないという制約だけが残る、という判断でADR 0013をSupersededとし、
# 撤去した(ADR 0015参照)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ext-authz-app
  namespace: gekko
data:
  app.py: |
    import http.server
    import json
    import os
    import re
    import socketserver
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    TOKEN_URL = os.environ.get(
        "KEYCLOAK_TOKEN_URL",
        "http://keycloak.gekko.svc.cluster.local:8080/realms/gekko/protocol/openid-connect/token",
    )
    GRANT_TYPE = os.environ.get("GRANT_TYPE", "token-exchange")  # "token-exchange" | "client_credentials"
    CLIENT_ID = os.environ.get("CLIENT_ID", "fraud-mcp-server")
    CLIENT_SECRET_FILE = os.environ.get("CLIENT_SECRET_FILE", "/secrets/client-secret")
    # ADR 0016でEnvoyサイドカーを追加したため、既定を127.0.0.1に変更(Pod外への直接到達を防ぐ。
    # ADR 0009 主対策①と同じ考え方)。Envoyのingressリスナーがこのポートへrouterで転送する。
    LISTEN_HOST = os.environ.get("LISTEN_HOST", "127.0.0.1")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "8080"))
    # client_credentialsモード専用:このインスタンスは呼び出し元1つに固定なので、scopeも
    # (ホスト,パス,メソッド)対応表ではなく固定値でよい(ADR 0010パターン②:ワイルドカードルート1本)
    FIXED_SCOPE = os.environ.get("FIXED_SCOPE")

    # access-control-design.md 表2をそのまま反映した(path, method) -> scope の対応表。
    # account-service自身のrbacポリシー(k8s/account-service/envoy-configmap.yaml)と同じ表2が
    # 単一の情報源であることに変わりはなく、ここはそれをコードに落としたコピーにすぎない。
    SCOPE_RULES = [
        (re.compile(r"^/accounts/[^/]+/unfreeze-proposals$"), "POST", "account:propose"),
        (re.compile(r"^/accounts/[^/]+(/.*)?$"), "GET", "account:read"),
    ]


    def resolve_scope(path, method):
        for pattern, expected_method, scope in SCOPE_RULES:
            if method == expected_method and pattern.match(path):
                return scope
        return None


    def read_client_secret():
        with open(CLIENT_SECRET_FILE) as f:
            return f.read().strip()


    def exchange_token(subject_token, audience, scope):
        data = urllib.parse.urlencode(
            {
                "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                "client_id": CLIENT_ID,
                "client_secret": read_client_secret(),
                "subject_token": subject_token,
                "subject_token_type": "urn:ietf:params:oauth:token-type:access_token",
                "audience": audience,
                "scope": scope,
            }
        ).encode()
        req = urllib.request.Request(
            TOKEN_URL, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"}
        )
        with urllib.request.urlopen(req, timeout=5) as resp:
            body = json.loads(resp.read())
            return body["access_token"]


    _cc_token_cache = {"token": None, "expires_at": 0.0}


    def get_client_credentials_token(scope):
        # 取得したトークンのキャッシュ・更新が主な仕事になる(ADR 0010パターン②)。
        # 期限ぎりぎりで使ってしまわないよう、expires_inより手前で切り上げて再取得する。
        now = time.monotonic()
        if _cc_token_cache["token"] and now < _cc_token_cache["expires_at"]:
            return _cc_token_cache["token"]
        data = urllib.parse.urlencode(
            {
                "grant_type": "client_credentials",
                "client_id": CLIENT_ID,
                "client_secret": read_client_secret(),
                "scope": scope,
            }
        ).encode()
        req = urllib.request.Request(
            TOKEN_URL, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"}
        )
        with urllib.request.urlopen(req, timeout=5) as resp:
            body = json.loads(resp.read())
        _cc_token_cache["token"] = body["access_token"]
        _cc_token_cache["expires_at"] = now + max(int(body.get("expires_in", 60)) - 10, 5)
        return _cc_token_cache["token"]


    class Handler(http.server.BaseHTTPRequestHandler):
        def deny(self, code, msg):
            print(f"DENY {code}: {msg}", file=sys.stderr, flush=True)
            self.send_response(code)
            self.end_headers()

        def do_check(self):
            # Envoyが自動転送するHost/Method/Path/Authorizationヘッダーを優先し、
            # 無ければ実際のリクエストライン(self.command/self.path)にフォールバックする
            # (ext_authz HTTPモードの正確な転送方式は実機で確認済みだが、将来のEnvoy挙動変化にも
            # 頑健にしておく)。
            host = self.headers.get("Host")
            method = self.headers.get("Method") or self.command
            path = self.headers.get("Path") or self.path

            if GRANT_TYPE == "client_credentials":
                # 呼び出し元(fraud-detection-engine)は委任チェーン外のためsubject_tokenを
                # 持たず、Authorizationヘッダーはそもそも送られてこない(ADR 0010パターン②)。
                if not host:
                    self.deny(400, "missing host")
                    return
                try:
                    token = get_client_credentials_token(FIXED_SCOPE)
                except urllib.error.HTTPError as e:
                    self.deny(403, f"client_credentials rejected: {e.code} {e.read()!r}")
                    return
                except Exception as e:  # noqa: BLE001 - スタブなので広く捕捉してfail closeする
                    self.deny(403, f"client_credentials failed: {e!r}")
                    return
                print(f"ALLOW(client_credentials) {method} {path} aud={host} scope={FIXED_SCOPE}", flush=True)
                self.send_response(200)
                self.send_header("Authorization", f"Bearer {token}")
                self.end_headers()
                return

            auth = self.headers.get("Authorization")
            if not host or not auth or not auth.startswith("Bearer "):
                self.deny(400, "missing host/authorization")
                return

            scope = resolve_scope(path, method)
            if not scope:
                self.deny(403, f"no scope mapping for {method} {path}")
                return

            subject_token = auth[len("Bearer ") :]
            try:
                new_token = exchange_token(subject_token, host, scope)
            except urllib.error.HTTPError as e:
                self.deny(403, f"token exchange rejected: {e.code} {e.read()!r}")
                return
            except Exception as e:  # noqa: BLE001 - スタブなので広く捕捉してfail closeする
                self.deny(403, f"token exchange failed: {e!r}")
                return

            print(f"ALLOW {method} {path} aud={host} scope={scope}", flush=True)
            self.send_response(200)
            self.send_header("Authorization", f"Bearer {new_token}")
            self.end_headers()

        do_GET = do_check
        do_POST = do_check
        do_PUT = do_check
        do_DELETE = do_check

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        srv = Server((LISTEN_HOST, LISTEN_PORT), Handler)
        print(f"ext-authz-service listening on {LISTEN_HOST}:{LISTEN_PORT}", flush=True)
        srv.serve_forever()
