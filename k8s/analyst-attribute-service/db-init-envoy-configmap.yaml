# analyst-attribute-service-db-init・analyst-attribute-service-seed両Job共用のEnvoyサイドカー
# 設定(ADR 0028)。ネイティブsidecarコンテナ(initContainersにrestartPolicy: Always。
# db-init-job.yaml・seed-job.yaml参照)として動作し、egressのみ(127.0.0.1:5432→tcp_proxy→
# postgres_upstreamクラスタでpostgresのmTLS終端Envoy(6432)へ)。内容がSPIFFE IDに依存しない
# (SDSがワークロード属性証明から動的に解決する)ため、2 Jobで1つのConfigMapを共有する。
# 内容は常駐4サービスのegressリスナー・postgres_upstreamクラスタと同一構造
# (k8s/account-service/envoy-configmap.yaml参照)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-attribute-service-db-init-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    node:
      id: analyst-attribute-service-db-init-envoy
      cluster: analyst-attribute-service-db-init
    static_resources:
      listeners:
        - name: postgres-egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 5432 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: postgres_tcp
                    cluster: postgres_upstream
      clusters:
        - name: postgres_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/postgres"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: postgres_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: postgres.gekko.svc.cluster.local, port_value: 6432 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
