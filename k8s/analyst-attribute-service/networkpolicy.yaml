# ADR 0018。委任チェーンの終端(表3)のため、呼び出し元はaccount-service・audit-service
# (ADR 0040/0041/0042で追加)のみ許可する。egressはKeycloakのJWKS取得(mTLS)と、自身の
# Postgresデータベース(ADR 0008・0026)のみ。ADR 0028で自身のEnvoyサイドカー経由のmTLS接続に
# 切り替えたため、宛先ポートはpostgresのmTLS終端Envoy(6432)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyst-attribute-service
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: analyst-attribute-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: audit-service
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 6432
---
# ADR 0018の実装漏れの修正(k8s/keycloak/networkpolicy.yamlのkeycloak-db-initと同じパターン):
# 接続元(db-init Job)側にも自分自身のegress許可ポリシーが要る。ADR 0028で自身のEnvoyサイドカー
# 経由のmTLS接続に切り替えたため、宛先ポートはpostgresのmTLS終端Envoy(6432)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyst-attribute-service-db-init
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: analyst-attribute-service-db-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 6432
---
# ADR 0018の実装漏れの修正(k8s/keycloak/networkpolicy.yamlのkeycloak-test-fixturesと同じパターン):
# 表6のテストアナリスト属性投入Job(seed-job.yaml)自身のegress許可。initContainer(resolve-subs)は
# edge-proxy経由でKeycloak UUIDを解決し、mainコンテナ(seed)はpostgresへUPSERTする(ADR 0026)。
# ADR 0028でpostgres向けを自身のEnvoyサイドカー経由のmTLS接続に切り替えたため、宛先ポートは
# postgresのmTLS終端Envoy(6432)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyst-attribute-service-seed
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: analyst-attribute-service-seed
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: edge-proxy
      ports:
        - protocol: TCP
          port: 80
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 6432
