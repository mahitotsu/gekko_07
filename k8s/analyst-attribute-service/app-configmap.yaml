# analyst-attribute-serviceの最小スタブ(表3先行検証用。本実装はGo、ADR 0007)。
# account-service/app-configmap.yamlと同一のパターン(ADR 0009 §3:loopback限定bind・接続元
# loopback再チェック・合言葉ヘッダー検証)。委任チェーンの終端であり、他のどこも呼ばないため、
# account-serviceのような下流への転送は持たない。受け取ったx-auth-*ヘッダーをそのままJSONで
# 返すだけで、検証スクリプトはこれを見てEnvoy/ext_authzが正しく動いたかを確認する。
#
# 検証ロジックは環境によらず単一(テスト時だけ迂回するフラグは作らない。CWE-489、ADR 0009 §3)。
# 期待値の出どころ(合言葉ファイルのパス)だけを環境変数で設定可能にする。
apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-attribute-service-stub-app
  namespace: gekko
data:
  app.py: |
    import http.server
    import json
    import os
    import socketserver

    BIND_HOST = os.environ.get("APP_BIND_HOST", "127.0.0.1")
    APP_PORT = int(os.environ.get("APP_PORT", "9000"))
    HANDSHAKE_HEADER = os.environ.get("HANDSHAKE_HEADER_NAME", "x-gekko-handshake")
    HANDSHAKE_FILE = os.environ.get("HANDSHAKE_TOKEN_FILE", "/handshake/token")


    def is_loopback(addr):
        return addr in ("127.0.0.1", "::1")


    class Handler(http.server.BaseHTTPRequestHandler):
        def handle_one_request(self):
            # 多層防御②(ADR 0009):bindアドレスの設定に関係なく、接続元がloopbackでなければ拒否する。
            if not is_loopback(self.client_address[0]):
                self.send_response(403)
                self.end_headers()
                self.close_connection = True
                return
            return super().handle_one_request()

        def do_request(self):
            # 多層防御③(ADR 0009):合言葉ヘッダーを検証してから初めてx-auth-*ヘッダーを信用する。
            # 欠落・不一致はどちらも同じfail closeとして扱う。
            try:
                with open(HANDSHAKE_FILE) as f:
                    expected = f.read().strip()
            except OSError:
                expected = None
            got = self.headers.get(HANDSHAKE_HEADER)
            if not expected or not got or got != expected:
                self.send_response(403)
                self.end_headers()
                self.wfile.write(b"handshake verification failed")
                return

            body = json.dumps(
                {
                    "method": self.command,
                    "path": self.path,
                    "sub": self.headers.get("x-auth-sub"),
                    "scope": self.headers.get("x-auth-scope"),
                    "jti": self.headers.get("x-auth-jti"),
                }
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        do_GET = do_request
        do_POST = do_request
        do_PUT = do_request
        do_DELETE = do_request

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        srv = Server((BIND_HOST, APP_PORT), Handler)
        print(f"stub app listening on {BIND_HOST}:{APP_PORT}", flush=True)
        srv.serve_forever()
