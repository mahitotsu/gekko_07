# analyst-attribute-serviceの本実装Deployment(Go標準ライブラリ。ADR 0002/0007/0009/0010/0026)。
# Service名・ラベルは本実装と同じ"analyst-attribute-service"にする(ADR 0010 MUST:
# Keycloakクライアントid=K8s Service名=audience名を常に同一の文字列にする)。
#
# Pod構成はinitContainer(合言葉生成)＋app＋Envoyの3者(architecture.md §3)。
# 委任チェーンの終端のため、account-service→analyst-attribute-service向けのようなegress
# (Token Exchange委任等)は持たない。ADR 0028でPostgres向けegressのみ追加した。EnvoyはADR 0028の
# db-init Jobと同じネイティブsidecar(initContainers、restartPolicy: Always)として起動し、
# その後ろのwait-for-postgres initContainerがPostgres疎通を確認してからappを起動する
# (appのDB接続失敗によるCrashLoopBackOffを避けるため)。
#
# appコンテナのイメージはservices/analyst-attribute-service/をMakefileの
# build-analyst-attribute-serviceターゲットでビルドし、`k3d image import`でクラスタへ持ち込む
# (レジストリは使わない。ADR 0026)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst-attribute-service
  namespace: gekko
  labels:
    app: analyst-attribute-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyst-attribute-service
  template:
    metadata:
      labels:
        app: analyst-attribute-service
    spec:
      # ADR 0028: "postgres"を127.0.0.1へ横取りし、自身のEnvoyのegressリスナーへ誘導する
      # (account-serviceと同じADR 0010パターン)。
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["postgres"]
      initContainers:
        # ADR 0009 §2③:Pod内合言葉。initContainerの完了がメインコンテナ起動前に保証されるため、
        # 「先に生成、後で両方が読む」がレースコンディションなく書ける。
        - name: handshake-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - "head -c32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /handshake/token"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
        # ネイティブsidecar(restartPolicy: Always。K8s 1.29+でGA、ADR 0028のdb-init Jobと同じ
        # パターン)。appコンテナより先に(SPIRE Workload APIからSVIDのSDS配信を受けて)起動・待受
        # させるため、通常のcontainersからここへ昇格した。appコンテナがEnvoyの起動完了前に
        # 127.0.0.1:5432へ接続しに行きCrashLoopBackOffする実機不具合(起動時のみ、数回のリトライで
        # 自然復旧するが再現性あり)への対策。Serviceのtargetport(http)解決・NetworkPolicyのポート
        # マッチングはcontainersと同様に機能する。
        - name: envoy
          restartPolicy: Always
          image: envoyproxy/envoy:v1.31.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HANDSHAKE_TOKEN="$(cat /handshake/token)"
              exec envoy -c /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: handshake
              mountPath: /handshake
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
        # 上のenvoy sidecarは起動さえすれば(SDS配信完了前でも)次のinitContainerへ進んでしまうため、
        # ここで実際にPostgres(Envoy egress→mTLS→postgres本体)への疎通が取れるまで待つ。
        # analyst-attribute-service-db-init(k8s/analyst-attribute-service/db-init-configmap.yaml)
        # と同じリトライループ。
        - name: wait-for-postgres
          image: postgres:17.11
          command:
            - bash
            - -c
            - |
              for i in $(seq 1 30); do
                pg_isready -h postgres -U postgres >/dev/null 2>&1 && exit 0
                echo "postgres(Envoy mTLS経由)への接続待機中($i/30)..."
                sleep 1
              done
              echo "postgresへの接続待機がタイムアウトしました" >&2
              exit 1
      containers:
        - name: app
          image: gekko07/analyst-attribute-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_BIND_HOST
              value: "127.0.0.1" # ADR 0009 主対策①:Pod外から直接到達不能にする
            - name: APP_PORT
              value: "9000"
            - name: HANDSHAKE_TOKEN_FILE
              value: "/handshake/token"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "analyst_attribute_service"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: analyst-attribute-service-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analyst-attribute-service-db
                  key: password
          volumeMounts:
            - name: handshake
              mountPath: /handshake
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: envoy-config
          configMap:
            name: analyst-attribute-service-envoy
        - name: handshake
          emptyDir: {}
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
