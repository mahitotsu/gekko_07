# realm・クライアント・スコープの定義（architecture.md §4のクライアント・スコープ設計表をそのまま反映）。
# KeycloakはPod起動時に`--import-realm`でこのJSONを読み込む（k8s/keycloak/deployment.yaml参照）。
# クライアントシークレットは記載しない（未指定の場合はKeycloakが起動時に自動生成する。
# 各サービス実装時にKeycloak管理コンソール／Admin REST APIから取得して使うこと）。
#
# 各クライアントのdefaultClientScopesは空にしている。profile/email/roles等のKeycloak標準
# client scopeは管理コンソールでrealmを新規作成した場合にのみ自動生成される組み込みscopeで、
# --import-realmでの直接importでは生成されない（参照すると"doesn't exist. Ignoring"警告に
# なるだけで実害はないが、実機確認済みの事実として記録する）。そのためログイントークンには
# 現状sub等のコアclaimのみが載る。プロフィール表示等でpreferred_username等が必要になったら、
# その時点でclientScopesに明示的に定義を追加する。
#
# clientScope/clientのdescriptionはKeycloakのDB上VARCHAR(255)相当の列に格納されるため、
# 255文字を超えると--import-realm自体が"ERROR: value too long for type character
# varying(255)"で失敗する（実機確認済み。account:readのdescriptionが303文字あり再現した）。
# 詳しい背景はコード側のコメントに書き、description自体は255文字以内に収めること。
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-gekko
  namespace: gekko
data:
  gekko-realm.json: |
    {
      "realm": "gekko",
      "enabled": true,
      "displayName": "gekko - 不正検知・口座凍結解除サンプル",
      "clientScopes": [
        {
          "name": "account:read",
          "description": "取引履歴・不審取引・口座情報の読み取り（対象audience: account-service。frontend→fraud-agent、fraud-agent→fraud-mcp-server間のToken Exchangeでも同名で使うため、audienceマッパーを3つ持つ。実際のaudienceはToken Exchangeリクエストのパラメータで1つに絞り込まれ、ADR 0005の単一audience原則は保たれる）",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "audience-account-service",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "account-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "audience-fraud-agent",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "fraud-agent",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "audience-fraud-mcp-server",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "fraud-mcp-server",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "account:propose",
          "description": "凍結解除案の記録（可逆・低リスク。対象audience: account-service）",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "audience-account-service",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "account-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "account:freeze",
          "description": "口座凍結の自動実行（機械間認証。対象audience: account-service。fraud-detection-engineのみに付与）",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "audience-account-service",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "account-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "account:unfreeze",
          "description": "口座凍結の解除の実行（不可逆・高リスク。対象audience: account-service。frontendのみに付与）",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "audience-account-service",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "account-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "analyst:read",
          "description": "アナリストの担当地域・権限レベル照会（対象audience: analyst-attribute-service。account-serviceのみに付与）",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "audience-analyst-attribute-service",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "analyst-attribute-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "frontend",
          "name": "frontend (BFF)",
          "description": "アナリスト向けBFF。ログイン（Authorization Code + PKCE）と用途ごとのToken Exchangeを実行する",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": false,
          "redirectUris": ["http://localhost:3000/*"],
          "webOrigins": ["http://localhost:3000"],
          "attributes": {
            "standard.token.exchange.enabled": "true",
            "pkce.code.challenge.method": "S256"
          },
          "defaultClientScopes": [],
          "optionalClientScopes": ["account:read", "account:unfreeze"],
          "protocolMappers": [
            {
              "name": "audience-self",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "frontend",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "fraud-agent",
          "name": "fraud-agent",
          "description": "AIエージェント本体。frontendから受け取ったトークン（aud=fraud-agent）を自身でfraud-mcp-server宛てに再exchangeする（ADR 0014）",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": false,
          "attributes": {
            "standard.token.exchange.enabled": "true"
          },
          "defaultClientScopes": [],
          "optionalClientScopes": ["account:read"]
        },
        {
          "clientId": "fraud-mcp-server",
          "name": "fraud-mcp-server",
          "description": "fraud-agentの代理としてaccount-serviceへアクセスする（MCP⇔REST/gRPC変換を担う）",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": false,
          "clientAuthenticatorType": "federated-jwt",
          "attributes": {
            "standard.token.exchange.enabled": "true",
            "jwt.credential.issuer": "spire-gekko",
            "jwt.credential.sub": "spiffe://gekko.internal/ns/gekko/sa/default/fraud-mcp-server"
          },
          "defaultClientScopes": [],
          "optionalClientScopes": ["account:read", "account:propose"]
        },
        {
          "clientId": "fraud-detection-engine",
          "name": "fraud-detection-engine",
          "description": "取引パターンを監視し疑わしい口座を自動凍結する。account-serviceへ機械間認証（client_credentials）でアクセスする",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": false,
          "clientAuthenticatorType": "federated-jwt",
          "attributes": {
            "jwt.credential.issuer": "spire-gekko",
            "jwt.credential.sub": "spiffe://gekko.internal/ns/gekko/sa/default/fraud-detection-engine"
          },
          "defaultClientScopes": [],
          "optionalClientScopes": ["account:freeze"]
        },
        {
          "clientId": "account-service",
          "name": "account-service",
          "description": "口座・取引データを保有する共有マイクロサービス。analyst-attribute-serviceへの委任元",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": false,
          "attributes": {
            "standard.token.exchange.enabled": "true"
          },
          "defaultClientScopes": [],
          "optionalClientScopes": ["analyst:read"]
        }
      ],
      "identityProviders": [
        {
          "alias": "spire-gekko",
          "providerId": "spiffe",
          "enabled": true,
          "config": {
            "trustDomain": "spiffe://gekko.internal",
            "bundleEndpoint": "https://spire-server.spire.svc.cluster.local:8443/"
          }
        }
      ]
    }
