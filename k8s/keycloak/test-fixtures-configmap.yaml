# 1ホップ先行検証(fraud-mcp-server→account-service)のためだけの最小限のテスト用フィクスチャ。
# 本番の認可設計(architecture.md §4)は変更しない。
#
# frontendの`directAccessGrantsEnabled`は、ADR 0031で本物のAuthorization Code + PKCEブラウザ
# フローに置き換えたため`false`に戻している(realm-configmap.yaml側。ADR 0024の簡易ログイン
# (ROPC)時代に一時的にtrueへ上書きしていた名残はここには残っていない)。
#
# access-control-design.md 表6の3アナリスト全員をここで作成する(ADR 0026:account-serviceの
# ABAC(表5)を実機検証するにはjunior/seniorの複数アナリストが要る。以前はyamada-analystのみ)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-test-fixtures
  namespace: gekko
data:
  fixtures.sh: |
    #!/bin/bash
    set -euo pipefail

    KCADM=/opt/keycloak/bin/kcadm.sh
    # ADR 0017: Keycloakの8080は撤廃済みのため、edge-proxy経由でアクセスする。
    SERVER="http://edge-proxy.gekko.svc.cluster.local:80"

    # 起動直後は数回リトライする(db-init-configmap.yamlと同じ理由。ADR 0018のNetworkPolicy
    # default-denyが新規Pod起動直後の数百ms〜数秒間、kube-router netpolのiptables/ipset反映に
    # 追いつかないことがある)。
    for i in $(seq 1 10); do
      curl -s -o /dev/null "$SERVER/realms/gekko" && break
      echo "edge-proxyへの接続待機中($i/10)..."
      sleep 1
    done

    "$KCADM" config credentials --server "$SERVER" --realm master --user admin --password "$KEYCLOAK_ADMIN_PASSWORD"

    # frontend(ADR 0024)・fraud-mcp-server(ADR 0019)・fraud-detection-engine(ADR 0020)は
    # いずれもclientAuthenticatorType: federated-jwtへ移行したため、client_secretの設定は
    # 不要になった(realm-configmap.yamlのjwt.credential.*属性で完結する)。

    # テストアナリスト(access-control-design.md 表6)。冪等: 既にいれば作り直さない。
    #
    # email/firstName/lastNameが未設定だと、ユーザーのrequiredActions配列が空でも
    # 「Account is not fully set up」(Keycloak 26のDeclarative User Profileが必須属性の
    # 欠落を検出し、ログイン時に動的にVERIFY_PROFILEを要求する。grant typeによらない)で
    # ログインが失敗することを実機で確認した。テスト目的でも実在に見えるメールアドレスは使わず、example.invalid
    # (RFC 2606で予約された、実在解決されないドメイン)を使う。
    create_or_update_user() {
      local username="$1" first_name="$2" last_name="$3" password_var="$4"
      local password="${!password_var}"

      if ! "$KCADM" get users -r gekko -q username="$username" | grep -q '"username"'; then
        "$KCADM" create users -r gekko \
          -s username="$username" \
          -s enabled=true \
          -s email="$username@example.invalid" \
          -s emailVerified=true \
          -s firstName="$first_name" \
          -s lastName="$last_name"
      fi
      local user_id
      user_id="$("$KCADM" get users -r gekko -q username="$username" | grep -m1 '"id"' | sed -E 's/.*"id" *: *"([^"]+)".*/\1/')"
      "$KCADM" update "users/$user_id" -r gekko \
        -s enabled=true \
        -s email="$username@example.invalid" \
        -s emailVerified=true \
        -s firstName="$first_name" \
        -s lastName="$last_name"
      "$KCADM" set-password -r gekko --userid "$user_id" --new-password "$password" --temporary=false
    }

    create_or_update_user yamada-analyst Yamada Analyst YAMADA_ANALYST_PASSWORD
    create_or_update_user suzuki-senior Suzuki Senior SUZUKI_SENIOR_PASSWORD
    create_or_update_user tanaka-junior Tanaka Junior TANAKA_JUNIOR_PASSWORD

    echo "keycloak test fixtures ready"
