# Keycloak用Envoyサイドカー設定(ADR 0016/0017)。account-serviceのingressパターン
# (ADR 0009/0012)と同じDownstreamTlsContextだが、jwt_authn/rbac/luaは持たない——ここでの
# 認可は業務認可(scope等)ではなく、許可された呼び出し元以外からのmTLS接続を通信路レベルで
# 拒否するだけの単純なroutrer転送。
#
# 8443(このリスナー)は以下5者専用のmTLS必須経路:
# - fraud-mcp-server(Token Exchange。ADR 0019で旧ext-authz-serviceから変更)
# - fraud-detection-engine(client_credentials。ADR 0020で旧ext-authz-service-ccから変更)
# - account-service(jwt_authnのJWKS取得。ADR 0017でmTLS化。表3のToken Exchangeも自身の
#   egress Envoyがこのポートへ接続する)
# - analyst-attribute-service(jwt_authnのJWKS取得。表3。account-serviceと同じ理由)
# - edge-proxy(ブラウザ・kcadm.sh・verify-hop.shなどSPIFFE身元を持ちえない呼び出し元の
#   代理。ADR 0017)
# ADR 0017でedge-proxyを導入したことで、keycloakコンテナ自体は8080を持たなくなり
# (KC_HTTP_HOST=127.0.0.1。k8s/keycloak/deployment.yaml参照)、account-serviceと同じ
# 「単一filter_chainで完全にmTLS必須」構成に統合できた。
#
# ADR 0028: Postgres向けegressリスナーを追加した(hostAliasesで"postgres"を127.0.0.1へ
# 横取り。account-service/fraud-detection-engineのegressパターンと同じ)。PostgresはHTTPでは
# ないため、既存のHTTPエリアとは別listenerとして純TCP(tcp_proxy)で構成する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    node:
      id: keycloak-envoy
      cluster: keycloak
    static_resources:
      listeners:
        - name: ingress-mtls
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: ["h2"]
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          # ADR 0019/0020: fraud-mcp-server・fraud-detection-engineがそれぞれ
                          # 自身で(旧ext-authz-service(-cc)に代わって)Keycloakへ直接mTLS
                          # 接続するようになった。
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-mcp-server"
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-detection-engine"
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/account-service"
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/analyst-attribute-service"
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/edge-proxy"
                          # ADR 0023: fraud-agentのtoken-exchangeサイドカーが自身でKeycloakへ
                          # 直接mTLS接続する(fraud-mcp-server/fraud-detection-engineと同じ理由)。
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-agent"
                          # ADR 0024/0031: frontendのtoken-exchangeサイドカーが、ログイン
                          # (認可コード→トークン交換)とaccount-service/fraud-agent向け
                          # Token Exchangeの両方で自身でKeycloakへ直接mTLS接続する。frontend
                          # アプリ本体のid_token検証用JWKS取得(server/utils/jwks.ts)もこの
                          # 許可リストを経由する。
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/frontend"
                          # ADR 0040/0041: audit-serviceのclient-credentialsサイドカーが
                          # 自身でKeycloakへ直接mTLS接続する(fraud-detection-engineと同じ理由)。
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/audit-service"
                      validation_context_sds_secret_config:
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    # 監査ログ集約(ADR 0025)。このEnvoyはjwt_authn/rbac/luaを持たない純mTLS
                    # 中継のため、sub/scope/jtiは空文字列になる(相関キーは持たない。実際の
                    # Keycloak監査はeventsListeners、k8s/keycloak/realm-configmap.yaml参照)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: keycloak
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak_app_upstream }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # ADR 0028: Postgres向けegress(hostAliasesで"postgres"を127.0.0.1へ横取り)。
        # PostgresはHTTPではないため、tcp_proxyフィルタのみの独立listenerにする。
        - name: postgres-egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 5432 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: postgres_tcp
                    cluster: postgres_upstream
      clusters:
        # 同一Pod内のkeycloakコンテナ自身(8080)へ平文で転送する。mTLS終端はこのEnvoyで
        # 完結しており、Pod内loopback越えは同一ネットワーク名前空間のため素のHTTP/1.1でよい。
        - name: keycloak_app_upstream
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: keycloak_app_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 8080 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012/0016)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        # ADR 0028: Postgresの mTLS終端Envoy(6432)へSPIRE発行のSVIDでmTLS接続する。
        - name: postgres_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/postgres"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: postgres_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: postgres.gekko.svc.cluster.local, port_value: 6432 }
