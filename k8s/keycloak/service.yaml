# http/http-mgmtはkeycloakコンテナ自身への平文経路(無変更。ブラウザ/kcadm.sh/verify-hop.sh用)。
# https-mtlsはEnvoyサイドカー(envoy-configmap.yaml)のmTLS必須リスナーへの経路
# (ext-authz-service/-cc専用。ADR 0016)。
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: gekko
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: http-mgmt
      port: 9000
      targetPort: http-mgmt
    - name: https-mtls
      port: 8443
      targetPort: https-mtls
