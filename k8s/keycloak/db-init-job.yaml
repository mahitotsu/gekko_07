# db-init-configmap.yamlのスクリプトを実行する1回限りのJob。Postgresのsuperuser権限で
# 自分のロール・DBを作る（借用の範囲はこの一度きりの実行に限る。Keycloak本体
# （deployment.yaml）はsuperuserではなく、ここで作った"keycloak"ロールだけを使う）。
#
# ADR 0028: Envoyサイドカーをネイティブsidecarコンテナ(initContainersにrestartPolicy: Always。
# 1.29+でGA)として追加した。db-initコンテナが終了すればkubeletが自動的にこのサイドカーも
# 終了させるため、Job自身の完了検知は妨げない。init.shの接続待機リトライループ(既存。
# db-init-configmap.yaml参照)が、サイドカー起動直後のSDS配信待ちにもそのまま効く。
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
  namespace: gekko
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        # NetworkPolicyのpodSelectorで指定できるように付与(ADR 0018)
        app: keycloak-db-init
    spec:
      restartPolicy: Never
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["postgres"]
      initContainers:
        - name: envoy
          restartPolicy: Always
          image: envoyproxy/envoy:v1.31.5
          command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      containers:
        - name: db-init
          image: postgres:17.11
          command: ["/bin/bash", "/scripts/init.sh"]
          env:
            - name: POSTGRES_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: keycloak-db-init
            defaultMode: 0755
        - name: envoy-config
          configMap:
            name: keycloak-db-init-envoy
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
