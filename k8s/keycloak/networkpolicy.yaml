# ADR 0018。https-mtls(8443)は許可されたSPIFFE IDを持つ呼び出し元
# (ext-authz-service(-cc)・account-service・edge-proxy。ADR 0017 Consequences参照)
# からのみ、http-mgmt(9000)はkubeletのprobeが到達するノードIP(このk3d環境では
# docker network 172.19.0.0/16)からのみ許可する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ext-authz-service
        - podSelector:
            matchLabels:
              app: ext-authz-service-cc
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: edge-proxy
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
