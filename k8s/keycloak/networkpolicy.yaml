# ADR 0018。https-mtls(8443)は許可されたSPIFFE IDを持つ呼び出し元
# (fraud-mcp-server(ADR 0019で旧ext-authz-serviceから変更)・
# fraud-detection-engine(ADR 0020で旧ext-authz-service-ccから変更)・account-service・
# analyst-attribute-service(表3、JWKS取得)・edge-proxy・fraud-agent(ADR 0023)。
# ADR 0017 Consequences参照)からのみ許可する。
# http-mgmt(9000)向けのingressルールはADR 0022でexecプローブ化した際に撤廃した
# (KC_HTTP_MANAGEMENT_HOST=127.0.0.1化に伴い、kubeletを含め誰からもネットワーク経由では
# 到達不能になったため、ノードIPを許可する必要自体が無くなった)。egressにSPIRE Serverの
# bundle endpoint(ADR 0019、spire namespace)向けを追加。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fraud-mcp-server
        - podSelector:
            matchLabels:
              app: fraud-detection-engine
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: analyst-attribute-service
        - podSelector:
            matchLabels:
              app: edge-proxy
        - podSelector:
            matchLabels:
              app: fraud-agent
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spire
          podSelector:
            matchLabels:
              app: spire-server
      ports:
        - protocol: TCP
          port: 8443
---
# ADR 0018の実装漏れの修正:default-denyはPod単位でingress/egress双方に適用されるため、
# 接続元(この場合keycloak-db-init Job)側にも自分自身のegress許可ポリシーが要る
# (宛先postgres側のingress許可だけでは不十分。実機で「postgres側は許可済みなのに
# connection refusedになる」という形で発覚した)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-init
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak-db-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# 上と同じ実装漏れの修正(keycloak-test-fixtures Job→edge-proxy)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-test-fixtures
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak-test-fixtures
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: edge-proxy
      ports:
        - protocol: TCP
          port: 80
