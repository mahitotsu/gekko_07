# ADR 0018。https-mtls(8443)は許可されたSPIFFE IDを持つ呼び出し元
# (ext-authz-service(-cc)・account-service・edge-proxy。ADR 0017 Consequences参照)
# からのみ、http-mgmt(9000)はkubeletのprobeが到達するノードIP(このk3d環境では
# docker network 172.19.0.0/16)からのみ許可する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ext-authz-service
        - podSelector:
            matchLabels:
              app: ext-authz-service-cc
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: edge-proxy
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# ADR 0018の実装漏れの修正:default-denyはPod単位でingress/egress双方に適用されるため、
# 接続元(この場合keycloak-db-init Job)側にも自分自身のegress許可ポリシーが要る
# (宛先postgres側のingress許可だけでは不十分。実機で「postgres側は許可済みなのに
# connection refusedになる」という形で発覚した)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-init
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak-db-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# 上と同じ実装漏れの修正(keycloak-test-fixtures Job→edge-proxy)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-test-fixtures
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: keycloak-test-fixtures
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: edge-proxy
      ports:
        - protocol: TCP
          port: 80
