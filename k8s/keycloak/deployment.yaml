# ローカル実行用のKeycloak（start-devモード）。
# PostgreSQLに永続化する（ADR 0008。k8s/postgres/参照）。realmインポート
# （--import-realm）はデータディレクトリが空の初回起動時のみ実質的な効果を持つ
# （既存realmに対してはIGNORE_EXISTING戦略のため、2回目以降の起動でrealm-configmap.yaml
# を書き換えても自動反映されない。反映するにはAdmin Consoleで手動編集するか、
# PostgresのkeycloakデータベースをリセットしてPodを再作成する。詳細はdocs/insights.md）。
#
# ADR 0016でEnvoyサイドカーを追加し、ext-authz-service(-cc)からの接続専用にmTLS必須のポート
# (https-mtls:8443)を新設した。ADR 0017でさらにedge-proxy(非mTLS外部接続を代理する
# リバースプロキシ)を導入し、keycloakコンテナ自体の8080はKC_HTTP_HOST=127.0.0.1で
# Pod外から直接到達不能にした(ADR 0009と同じ考え方。account-service/ext-authz-serviceの
# appコンテナと同様)。KC_HTTP_MANAGEMENT_HOSTは明示的に0.0.0.0のまま残す——
# `--http-management-host`は既定で`--http-host`を継承するため、これが無いとhealth/mgmt(9000)
# まで道連れでloopback化し、kubeletのreadiness/liveness/startupProbeが壊れることを実機で確認した。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: gekko
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # ADR 0004: 外部公開はkubectl port-forwardで行い、KC_HOSTNAMEは
            # ホストから到達する固定URLに固定する（ADR 0017で`kubectl port-forward svc/edge-proxy
            # 3000:80`へ変更。edge-proxyはKeycloakへ透過的に転送するためURL自体は変わらない）。
            - name: KC_HOSTNAME
              value: "http://localhost:3000"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # ADR 0017: appをPod外から直接到達不能にする(ADR 0009と同じ考え方)。
            # KC_HTTP_MANAGEMENT_HOSTが無いと--http-hostを継承してmgmt(9000)まで
            # loopback化され、kubeletのプローブが壊れる(実機確認済み)。
            - name: KC_HTTP_HOST
              value: "127.0.0.1"
            - name: KC_HTTP_MANAGEMENT_HOST
              value: "0.0.0.0"
            # ADR 0008: account-service等と同じ共有PostgreSQLインスタンス内の
            # 専用データベースに接続する（ロールもDB名も"keycloak"）。
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: http-mgmt
              containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            # WSL2側のメモリ逼迫が既知の問題のため（docs/insights.md）、requestsは控えめにする。
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # timeoutSecondsを明示しないと既定1秒になる。このホストはWSL2の既知のメモリ
          # 逼迫（docs/insights.md）があり、GC・CPU競合で応答が1秒を超えることがあり得る。
          # 特にlivenessProbeがこれで詰まると誤検知でコンテナが強制再起動されるため、
          # 3サービス（readiness/liveness/startup）とも余裕を持たせる。
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-mgmt
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-mgmt
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: http-mgmt
            # augmentation・DBスキーマ移行が最低でも数十秒かかることが実機で分かっているため
            # （初回起動ログで47秒等）、絶対に成功し得ない最初の20秒は無駄なプローブをしない。
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
        - name: envoy
          image: envoyproxy/envoy:v1.31.5
          command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: https-mtls
              containerPort: 8443
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012/0016)。keycloakコンテナは
            # マウントしない(秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-gekko
        - name: envoy-config
          configMap:
            name: keycloak-envoy
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
