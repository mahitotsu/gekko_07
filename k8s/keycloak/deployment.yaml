# ローカル実行用のKeycloak（start-devモード）。
# PostgreSQLに永続化する（ADR 0008。k8s/postgres/参照）。realmインポート
# （--import-realm）はデータディレクトリが空の初回起動時のみ実質的な効果を持つ
# （既存realmに対してはIGNORE_EXISTING戦略のため、2回目以降の起動でrealm-configmap.yaml
# を書き換えても自動反映されない。反映するにはAdmin Consoleで手動編集するか、
# PostgresのkeycloakデータベースをリセットしてPodを再作成する。詳細はdocs/insights.md）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: gekko
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # ADR 0004: 外部公開はkubectl port-forwardで行い、KC_HOSTNAMEは
            # ホストから到達する固定URLに固定する（`kubectl port-forward svc/keycloak 3000:8080`）。
            - name: KC_HOSTNAME
              value: "http://localhost:3000"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # ADR 0008: account-service等と同じ共有PostgreSQLインスタンス内の
            # 専用データベースに接続する（ロールもDB名も"keycloak"）。
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: http-mgmt
              containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            # WSL2側のメモリ逼迫が既知の問題のため（docs/insights.md）、requestsは控えめにする。
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # timeoutSecondsを明示しないと既定1秒になる。このホストはWSL2の既知のメモリ
          # 逼迫（docs/insights.md）があり、GC・CPU競合で応答が1秒を超えることがあり得る。
          # 特にlivenessProbeがこれで詰まると誤検知でコンテナが強制再起動されるため、
          # 3サービス（readiness/liveness/startup）とも余裕を持たせる。
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-mgmt
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-mgmt
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: http-mgmt
            # augmentation・DBスキーマ移行が最低でも数十秒かかることが実機で分かっているため
            # （初回起動ログで47秒等）、絶対に成功し得ない最初の20秒は無駄なプローブをしない。
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-gekko
