# ADR 0018。ingressはfrontendのみ許可する(ADR 0042でsenior限定閲覧ゲートをmTLS+jwt_authn+rbac
# で実装したため。ADR 0040/0041時点の「port-forwardのみ」からの変更)。egressは
# account-service(自己申告の読み取り専用API)・analyst-attribute-service(senior限定ゲート判定、
# ADR 0042)・keycloak(client_credentials/Token Exchange)・observability namespaceのotel-lgtm
# (Loki query API、第三者記録の取得元)を許可する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-service
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: audit-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: analyst-attribute-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: otel-lgtm
      ports:
        - protocol: TCP
          port: 3100
