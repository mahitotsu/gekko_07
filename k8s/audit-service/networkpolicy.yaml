# ADR 0018。ingressは無し(kubectl port-forwardのみを前提にする。k8s/observability/の
# Grafanaと同じ理由でNetworkPolicyのingressルールは不要。ADR 0040/0041)。egressは
# account-service(自己申告の読み取り専用API)・keycloak(client_credentials)・
# observability namespaceのotel-lgtm(Loki query API、第三者記録の取得元)のみ許可する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-service
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: audit-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: otel-lgtm
      ports:
        - protocol: TCP
          port: 3100
