# observability namespace全Podに対するingress/egressのデフォルト拒否(ADR 0018の適用範囲を
# observability namespaceへも拡張する。ADR 0025)。k8s/network-policy/default-deny.yamlと同型。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
