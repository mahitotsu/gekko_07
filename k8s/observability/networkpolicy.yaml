# Alloy→otel-lgtmのLoki push(3100)に加え、discovery.kubernetes(Podメタデータ取得)が使う
# Kubernetes APIサーバーへのegressを許可する(ADR 0025)。APIサーバーはpodSelectorで表現できない
# 特殊なService(selectorなし)のため、ipBlockで明示する必要がある。
#
# 宛先は`kubernetes`Service自体のClusterIP(`10.43.0.1:443`)ではなく、k3dノードの実IP:6443
# (`kubectl get endpoints kubernetes`で分かる実体)でなければならない——実機で確認済み。
# k3dの既定CNI(kube-router)はNetworkPolicyをDNAT後(=ClusterIPが実体のPod/ノードIPへ
# 変換された後)の宛先に対して評価するため、ClusterIP宛てのipBlockルールだけでは一致しない。
# default-deny適用後にdiscovery.kubernetes.podsのtargetsが0件のまま変化しなくなる
# (=Podがログの絞り込み対象に一切現れない。RBACは正しくても経路自体が塞がれ、TCP接続の
# 試行自体が/proc/net/tcpに一切現れない)という形で発覚した。edge-proxy(ADR 0004)の
# k3dノードCIDR ipBlock例外と同じCIDRを、ポートだけ6443にして流用する(値は`docker network
# inspect k3d-gekko07`の実値と一致させる。クラスタ再作成等でドリフトしうる。insights.md
# 「k3d docker networkサブネットのドリフト」参照)。
#
# Grafana UI(3000)へのkubectl port-forwardは、keycloak-forward(edge-proxy、gekko namespace)と
# 同様にkubeletがPodのネットワーク名前空間へ直接接続する経路のため、NetworkPolicyのingressルールは
# 不要(既存のkeycloak-forwardが同じ前提のdefault-deny下で動いている実績と同じ)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: alloy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: otel-lgtm
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-lgtm
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: otel-lgtm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - protocol: TCP
          port: 3100
    # ADR 0040/0041: audit-service(gekko namespace)がLoki query API(3100)を第三者記録の
    # 取得元として叩く。namespaceSelector+podSelectorの組み合わせ(同一from要素内=AND)で
    # gekko namespaceのaudit-service Podのみに絞る。gekko namespace自体の許可ラベルは
    # Kubernetesが自動付与する`kubernetes.io/metadata.name`を使う(実機で存在確認済み)。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gekko
          podSelector:
            matchLabels:
              app: audit-service
      ports:
        - protocol: TCP
          port: 3100
