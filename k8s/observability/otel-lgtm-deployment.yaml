# otel-lgtm本体(Grafana+Loki+Prometheus+Tempo+Pyroscope+OTel Collectorの一体型イメージ、ADR 0025)。
# 今回使うのはGrafana(3000)+Loki(3100)のみ。Prometheus/Tempo/Pyroscope/OTel Collectorも
# 同じコンテナ内で起動するが未使用(個別無効化はできなかった。デモ/開発用イメージとして
# 公式に非推奨とされる本番運用は行わない前提で許容する)。
# PVCなし(ephemeral): Pod再起動でログは失われる。永続化が要る場合は別途検討する(architecture.md)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: observability
  labels:
    app: otel-lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.33.0
          ports:
            - name: grafana
              containerPort: 3000
            - name: loki
              containerPort: 3100
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
