# account-serviceの本実装Deployment(Java/Spring Boot。ADR 0002/0007/0009/0010/0026)。
# Service名・ラベルは本実装と同じ"account-service"にする(ADR 0010 MUST:
# Keycloakクライアントid=K8s Service名=audience名を常に同一の文字列にする)。
#
# Pod構成はinitContainer(合言葉生成)＋app＋Envoy＋token-exchangeの4者(architecture.md §3、
# ADR 0019/0020のパターンをtoken-exchangeサイドカーとして最初から適用)。
#
# hostAliasesで"analyst-attribute-service"・"keycloak"を127.0.0.1へ静的にマッピングし、表3
# (account-service→analyst-attribute-service)向けのegressリスナー(account-service-envoy
# ConfigMap参照)へappからのリクエストとtoken-exchangeサイドカー自身のKeycloak向けリクエストを
# 横取りさせる(fraud-mcp-server/deployment.yamlと同じADR 0010/0019パターン)。account-service
# はingress/egress両方を持つ初めてのサービスになる。
#
# appコンテナのイメージはservices/account-service/のMavenプロジェクトをMakefileの
# build-account-serviceターゲットでビルドし、`k3d image import`でクラスタへ持ち込む
# (レジストリは使わない。ADR 0026)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: gekko
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["analyst-attribute-service", "keycloak", "postgres"] # ADR 0028: postgresを追加
      initContainers:
        # ADR 0009 §2③:Pod内合言葉。initContainerの完了がメインコンテナ起動前に保証されるため、
        # 「先に生成、後で両方が読む」がレースコンディションなく書ける。
        - name: handshake-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - "head -c32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /handshake/token"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
      containers:
        - name: app
          image: gekko07/account-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_BIND_HOST
              value: "127.0.0.1" # ADR 0009 主対策①:Pod外から直接到達不能にする
            - name: APP_PORT
              value: "9000"
            - name: HANDSHAKE_TOKEN_FILE
              value: "/handshake/token"
            - name: ANALYST_ATTRIBUTE_SERVICE_URL
              value: "http://analyst-attribute-service/"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "account_service"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: account-service-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-service-db
                  key: password
          volumeMounts:
            - name: handshake
              mountPath: /handshake
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        - name: envoy
          image: envoyproxy/envoy:v1.31.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HANDSHAKE_TOKEN="$(cat /handshake/token)"
              exec envoy -c /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: handshake
              mountPath: /handshake
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
        # 表3(account-service→analyst-attribute-service)のToken Exchange実行主体。envoyコンテナと
        # 同じくWorkload API UDSソケットへアクセスする(JWT-SVID取得のため)。SPIRE registration
        # entryもenvoyコンテナと並んでこのコンテナ名をselectorに持つ(k8s/spire/entries-configmap.yaml
        # 参照。ADR 0019/0020と同じパターン)。
        - name: token-exchange
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: CLIENT_ID
              value: "account-service"
            - name: FIXED_SCOPE
              value: "analyst:read"
            - name: JWT_SVID_AUDIENCE
              value: "http://localhost:3000/realms/gekko"
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "9002"
            - name: KEYCLOAK_TOKEN_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/token"
          volumeMounts:
            - name: token-exchange-app-script
              mountPath: /scripts
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Kubernetes ImageVolume(1.33+ Beta)でspire-agentイメージから`spire-agent`
            # CLIバイナリだけを読み取り専用マウントする(ADR 0019と同じ理由。distroless系
            # イメージでシェルが無くコピーもできないため)。
            - name: spire-agent-bin
              mountPath: /spire-bin
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: token-exchange-app-script
          configMap:
            name: account-service-token-exchange-app
        - name: envoy-config
          configMap:
            name: account-service-envoy
        - name: handshake
          emptyDir: {}
        - name: spire-agent-bin
          image:
            reference: ghcr.io/spiffe/spire-agent:1.15.3
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
