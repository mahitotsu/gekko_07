# ADR 0018。呼び出し元(fraud-mcp-server・fraud-detection-engine)からのingressと、
# KeycloakのJWKS取得(mTLS)へのegressのみを許可する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-service
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: account-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fraud-mcp-server
        - podSelector:
            matchLabels:
              app: fraud-detection-engine
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
