# ADR 0018。呼び出し元(fraud-mcp-server・fraud-detection-engine・frontend(ADR 0024))からの
# ingressと、KeycloakのJWKS取得(mTLS)・analyst-attribute-serviceへのToken Exchange委任(表3。
# ADR 0019/0020のパターンを最初から適用)へのegressを許可する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-service
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: account-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fraud-mcp-server
        - podSelector:
            matchLabels:
              app: fraud-detection-engine
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app: analyst-attribute-service
      ports:
        - protocol: TCP
          port: 8080
