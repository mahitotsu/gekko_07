# account-service ingress側Envoy設定(ADR 0009)。jwt_authn(署名・iss・aud検証、クレームを
# x-auth-*ヘッダーへ)→rbac(access-control-design.md 表2のscope要求)→lua(rbac通過後にのみ
# 合言葉ヘッダーを付与。ADR 0009 §2③)→router、の順で通す。
#
# freezeポリシーはfraud-detection-engineのclient_credentialsトークン(委任チェーン外。表4参照)
# のみを受け付ける。jwt_authnはsubクレームの有無を区別しないため、account:freezeスコープの
# 保有だけがゲートになる(ADR 0010パターン②の実機検証で追加)。
#
# SPIRE発行のSVIDによるmTLS+ALPN h2(ADR 0012)をfraud-mcp-server→account-serviceに導入した際、
# 呼び出し元を1つに限定するとSPIRE化していないfraud-detection-engineが壊れるため、TLS/plaintext
# の2つのfilter_chainに分けていた。ADR 0015でfraud-detection-engineもSPIRE化し、account-service
# の呼び出し元は全てmTLS必須になったため、単一のfilter_chainに戻した(plaintext受け口の完全撤廃。
# ADR 0012が残していた既知の限界を解消)。transport_socketはjwt_authn/rbac/luaのHTTPフィルタ
# チェーンより手前(TLS層)で効くため、既存のフィルタ順序・スコープ検証ロジックには影響しない。
# require_client_certificate: trueが相互(サーバー側のみでない)TLSを強制する。
# combined_validation_contextのmatch_typed_subject_alt_namesで、mTLSレベルでも呼び出し元を
# fraud-mcp-server・fraud-detection-engine自身のSPIFFE IDに限定する(認可層のscope検証とは
# 独立な、通信路レベルの許可リスト)。
#
# DPoP(ADR 0013)による送信者拘束は一度導入したが、このホップは既にSPIRE mTLSで呼び出し元の身元を
# 限定済みのため実利がmTLSと大きく重複する一方、Token Exchangeを跨いだ拘束はチェーンの終端ホップに
# しか置けないという制約だけが残るという判断でADR 0013をSupersededとし、撤去した(ADR 0015参照)。
#
# 表3(account-service→analyst-attribute-service)向けにegressリスナーを追加した。fraud-mcp-server
# のegressパターン(ADR 0002/0010:hostAliasesで宛先名を横取りし、ext_authz→実アップストリームへ
# 転送)を、ADR 0019/0020のToken Exchange実行主体をPod内サイドカーへ置く構成のまま、このEnvoyに
# 同居させた。このプロジェクトでingress/egress両方のリスナーを持つのはaccount-serviceが最初
# (他は今のところサーバー専用かクライアント専用のどちらか)。spire_agentクラスタはingress側と共用する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: account-service-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    # SDS(SPIRE Agent Workload API)はxDSプロトコルの一種であり、DiscoveryRequestにnode識別子が
    # 要る(実機検証で判明:未設定だと"TlsCertificateSdsApi: node 'id' and 'cluster' are required"で
    # 起動時エラーになる。ADR 0012)。
    node:
      id: account-service-envoy
      cluster: account-service
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: ["h2"]
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-mcp-server"
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-detection-engine"
                          # ADR 0024: frontendの確定パス(account:unfreeze)・読み取りパス
                          # (account:read)を許可する。
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/frontend"
                      validation_context_sds_secret_config:
                        # "ROOTCA"はSPIRE Agent SDSの既定マジック名(default_bundle_name)。
                        # 信頼ドメイン名等の任意文字列を指定すると、SPIRE側はそれを特定の
                        # SPIFFE ID(フェデレーション用)へのリクエストと解釈し、該当エントリが
                        # 存在しないため"workload is not authorized for the requested identities"
                        # で拒否される(実機検証で判明。ADR 0012)。
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    # 監査ログ集約(ADR 0025)。sub/scope/jtiはjwt_authnがこのリクエストに
                    # 実ヘッダーとして注入済み(claim_to_headers)のため、access_logからも
                    # %REQ(...)%でそのまま参照できる。標準出力(StdoutAccessLog)に出し、
                    # k8s/observability/のAlloyがhostPath経由でtailしてLokiへ集約する。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: account_service
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: app_upstream }
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              issuer: "http://localhost:3000/realms/gekko"
                              audiences: ["account-service"]
                              remote_jwks:
                                http_uri:
                                  uri: "https://keycloak.gekko.svc.cluster.local:8443/realms/gekko/protocol/openid-connect/certs"
                                  cluster: keycloak_jwks
                                  timeout: 5s
                                cache_duration: 300s
                              forward: true
                              claim_to_headers:
                                - header_name: "x-auth-sub"
                                  claim_name: "sub"
                                - header_name: "x-auth-scope"
                                  claim_name: "scope"
                                - header_name: "x-auth-jti"
                                  claim_name: "jti"
                          rules:
                            - match: { prefix: "/" }
                              requires: { provider_name: "keycloak" }
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              read:
                                permissions:
                                  - and_rules:
                                      rules:
                                        - header: { name: ":method", string_match: { exact: "GET" } }
                                        - url_path:
                                            path: { prefix: "/accounts/" }
                                principals:
                                  - header: { name: "x-auth-scope", string_match: { contains: "account:read" } }
                              propose:
                                permissions:
                                  - and_rules:
                                      rules:
                                        - header: { name: ":method", string_match: { exact: "POST" } }
                                        - url_path:
                                            path:
                                              safe_regex:
                                                google_re2: {}
                                                regex: "^/accounts/[^/]+/unfreeze-proposals$"
                                principals:
                                  - header: { name: "x-auth-scope", string_match: { contains: "account:propose" } }
                              freeze:
                                permissions:
                                  - and_rules:
                                      rules:
                                        - header: { name: ":method", string_match: { exact: "POST" } }
                                        - url_path:
                                            path:
                                              safe_regex:
                                                google_re2: {}
                                                regex: "^/accounts/[^/]+/freeze$"
                                principals:
                                  - header: { name: "x-auth-scope", string_match: { contains: "account:freeze" } }
                              # ADR 0024: frontendが最初の呼び出し元(確定パス、決定論的操作)。
                              unfreeze:
                                permissions:
                                  - and_rules:
                                      rules:
                                        - header: { name: ":method", string_match: { exact: "POST" } }
                                        - url_path:
                                            path:
                                              safe_regex:
                                                google_re2: {}
                                                regex: "^/accounts/[^/]+/unfreeze$"
                                principals:
                                  - header: { name: "x-auth-scope", string_match: { contains: "account:unfreeze" } }
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              -- rbacの後に配置しているため、ここに到達するのはrbacを通過した
                              -- リクエストのみ(ADR 0009 §2③:素通りしたリクエストに付与しては
                              -- 意味がない)。
                              function envoy_on_request(request_handle)
                                local token = os.getenv("HANDSHAKE_TOKEN")
                                if token then
                                  request_handle:headers():replace("x-gekko-handshake", token)
                                end
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # 表3(account-service→analyst-attribute-service)向けegressリスナー(ADR 0019/0020と同じ
        # パターン)。hostAliasesで"analyst-attribute-service"・"keycloak"を127.0.0.1へ横取りし、
        # appからのリクエストとtoken-exchangeサイドカー自身のKeycloak向けリクエストの両方を
        # このリスナーで受け止める。
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    # 監査ログ集約(ADR 0025)。egress側にjwt_authnは無いため、appがx-auth-*を
                    # 転送しない限りsub/scope/jtiは空文字列になる(Token Exchange自体の相関は
                    # Keycloakのイベントログ側で追う。architecture.md §8参照)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: analyst_attribute_service
                          domains: ["analyst-attribute-service"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: analyst_attribute_service_upstream }
                        # token-exchangeサイドカー自身がKeycloakのトークンエンドポイントを叩く際の
                        # 宛先。http_filtersはリスナー全体に適用されるため、このルートだけext_authz
                        # を無効化しないと、サイドカー自身のKeycloak宛て通信が自己参照的にext_authz
                        # へ回されてしまう(ADR 0019で判明した問題と同じ)。
                        - name: keycloak
                          domains: ["keycloak"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak_upstream }
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://127.0.0.1:9002"
                              cluster: token_exchange_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: app_upstream
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: app_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9000 }
        # ADR 0017でmTLS化(edge-proxy導入に伴いKeycloakの8080が撤廃されたため)。
        # account-serviceは既にSPIRE化済みのため、edge-proxyを経由せず直接Keycloakの
        # mTLSポート(8443)へ接続する。
        - name: keycloak_jwks
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012)。tls_certificate_sds_secret_configs/
        # validation_context_sds_secret_configの双方から参照される。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        # 表3向けegressリスナーのアップストリーム。SPIRE発行のSVIDによるmTLS+ALPN h2を追加する
        # (fraud-mcp-server→account-serviceと同じ構成をこのホップへ横展開)。
        - name: analyst_attribute_service_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/analyst-attribute-service"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: analyst_attribute_service_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: analyst-attribute-service.gekko.svc.cluster.local, port_value: 8080 }
        # token-exchangeサイドカー(同一Pod、loopback)。app_upstreamと同じ信頼境界のため
        # plaintextでよい(mTLS不要。ADR 0019と同じ考え方)。
        - name: token_exchange_cluster
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: token_exchange_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9002 }
        # token-exchangeサイドカーがKeycloakのトークンエンドポイントへmTLSで直接接続する
        # (keycloak_jwksクラスタと宛先は同じだが、用途を分けて別クラスタにしてある。
        # ADR 0019のkeycloak_upstreamと同じ構成)。
        - name: keycloak_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
