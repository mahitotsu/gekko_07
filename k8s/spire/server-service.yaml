# StatefulSetのgoverning service(headless)。spire-agentはserver_address="spire-server"
# (spire namespace内なので同namespace短縮名で解決)でこのServiceへ接続する(ADR 0012)。
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  clusterIP: None
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
