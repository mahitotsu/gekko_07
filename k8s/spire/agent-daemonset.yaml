# spire-agent本体(ADR 0012)。hostPID/hostNetworkはこのリポジトリで初めて使う特権的な設定で、
# k8s WorkloadAttestorがSO_PEERCRED経由でWorkload API呼び出し元のPIDを解決し、ホストの
# /proc経由でcgroup/コンテナへ相関づけるために必要(この目的のためだけの意図的な例外。
# ワークロードPod側(account-service-stub/fraud-mcp-server-stub)には付与しない。
# 属性解決が実機で失敗した場合のみ再検討する)。
# initContainerはspire-serverが疎通可能になるまで待つ(起動順序のガード。公式quickstartと同じ形)。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: wait-for-spire-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z spire-server 8081; do
                echo "waiting for spire-server:8081..."
                sleep 2
              done
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.3
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
            - name: spire-token
              mountPath: /var/run/secrets/tokens
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
      volumes:
        - name: spire-config
          configMap:
            name: spire-agent-config
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
