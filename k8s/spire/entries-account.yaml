# registration entry作成Job用のRBAC(ADR 0012)。このリポジトリで初めてpods/execを使う箇所。
# resourceNamesでspire-server-0だけに絞り、最小権限にする。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-entries
  namespace: spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-entries
  namespace: spire
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: ["spire-server-0"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    resourceNames: ["spire-server-0"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-entries
  namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-entries
subjects:
  - kind: ServiceAccount
    name: spire-entries
    namespace: spire
