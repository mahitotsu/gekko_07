# registration entry作成スクリプト(ADR 0012/0015)。account-service/fraud-mcp-server/
# fraud-detection-engineいずれもEnvoyコンテナだけをselectorで指定する
# (k8s:container-name:envoy。アプリコンテナは秘密鍵に一切触れない)。
# spire-server entry createは重複IDに対して非冪等なため、entry showで存在確認してから作成する。
#
# fraud-mcp-server・fraud-detection-engine・account-service・fraud-agent・frontendは例外的に、
# 同一SPIFFE IDに対しenvoy・token-exchangeまたはclient-credentials(ADR 0019/0020/0021/0023/0024)の
# 2コンテナ分のentryを持つ(いずれもインフラ層のコンテナで、appコンテナ自体は秘密鍵に触れないという
# 原則は変わらない)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-entries-script
  namespace: spire
data:
  create-entries.sh: |
    #!/bin/bash
    set -euo pipefail

    SERVER_POD="spire-server-0"
    SERVER_NS="spire"
    TRUST_DOMAIN="gekko.internal"
    NODE_ALIAS_ID="spiffe://${TRUST_DOMAIN}/ns/spire/sa/spire-agent"

    # 公式ghcr.io/spiffe/spire-serverイメージはシェルを含まない(distroless系)ため、
    # kubectl execはバイナリを絶対パスで直接起動する必要がある(実機検証で判明。
    # PATHに乗っていないため"which"等でも解決できない)。
    kexec() {
      kubectl exec -n "$SERVER_NS" "$SERVER_POD" -c spire-server -- /opt/spire/bin/spire-server "$@"
    }

    create_if_missing() {
      local spiffe_id="$1"
      shift
      if kexec entry show -spiffeID "$spiffe_id" 2>/dev/null | grep -q "Entry ID"; then
        echo "entry already exists: $spiffe_id"
      else
        kexec entry create "$@"
      fi
    }

    # fraud-mcp-serverのように同一SPIFFE IDに複数entry(セレクタ違い)を持たせる場合は
    # -spiffeIDでの存在確認が使えない(同じIDを持つ他entryにヒットして誤検知する)ため、
    # セレクタの完全一致で存在確認する。
    create_if_missing_by_selectors() {
      local spiffe_id="$1"
      shift
      local selector_args=()
      local create_args=("-parentID" "$NODE_ALIAS_ID" "-spiffeID" "$spiffe_id")
      for sel in "$@"; do
        selector_args+=("-selector" "$sel")
        create_args+=("-selector" "$sel")
      done
      if kexec entry show "${selector_args[@]}" -matchSelectorsOn exact 2>/dev/null | grep -q "Entry ID"; then
        echo "entry already exists (by selector): $spiffe_id ($*)"
      else
        kexec entry create "${create_args[@]}"
      fi
    }

    echo "==> node alias entry"
    create_if_missing "$NODE_ALIAS_ID" \
      -node \
      -spiffeID "$NODE_ALIAS_ID" \
      -selector k8s_psat:cluster:gekko07 \
      -selector k8s_psat:agent_ns:spire \
      -selector k8s_psat:agent_sa:spire-agent

    echo "==> account-service entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/account-service" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/account-service" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:account-service \
      -selector k8s:container-name:envoy

    # 表3(account-service→analyst-attribute-service)のToken Exchange実行主体(token-exchange
    # サイドカー)も同じSPIFFE IDで動く必要がある(JWT-SVID取得のため。fraud-mcp-server(ADR 0019)・
    # fraud-detection-engine(ADR 0020)と同じ理由)。
    echo "==> account-service entry (token-exchange container only)"
    create_if_missing_by_selectors "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/account-service" \
      k8s:ns:gekko k8s:sa:default k8s:pod-label:app:account-service k8s:container-name:token-exchange

    echo "==> fraud-mcp-server entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-mcp-server" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-mcp-server" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:fraud-mcp-server \
      -selector k8s:container-name:envoy

    # ADR 0019: Token Exchange実行主体(token-exchangeサイドカー)も同じSPIFFE IDで
    # 動く必要がある(JWT-SVID取得のため)。異なるcontainer-nameセレクタを持つ別entryとして
    # 追加する(spire-server entry createは同一spiffeIDへの複数entry作成を許容する。
    # 1つのentryのselectorはAND条件のため、envoy/token-exchangeを1つのentryにまとめる
    # ことはできない)。
    echo "==> fraud-mcp-server entry (token-exchange container only)"
    create_if_missing_by_selectors "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-mcp-server" \
      k8s:ns:gekko k8s:sa:default k8s:pod-label:app:fraud-mcp-server k8s:container-name:token-exchange

    echo "==> fraud-detection-engine entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-detection-engine" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-detection-engine" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:fraud-detection-engine \
      -selector k8s:container-name:envoy

    # ADR 0020: client_credentialsトークン取得実行主体(client-credentialsサイドカー)も
    # 同じSPIFFE IDで動く必要がある(JWT-SVID取得のため。fraud-mcp-server(ADR 0019)と
    # 同じ理由)。
    echo "==> fraud-detection-engine entry (client-credentials container only)"
    create_if_missing_by_selectors "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-detection-engine" \
      k8s:ns:gekko k8s:sa:default k8s:pod-label:app:fraud-detection-engine k8s:container-name:client-credentials

    echo "==> keycloak entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/keycloak" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/keycloak" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:keycloak \
      -selector k8s:container-name:envoy

    echo "==> analyst-attribute-service entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/analyst-attribute-service" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/analyst-attribute-service" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:analyst-attribute-service \
      -selector k8s:container-name:envoy

    echo "==> fraud-agent entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-agent" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-agent" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:fraud-agent \
      -selector k8s:container-name:envoy

    # ADR 0023: Token Exchange実行主体(token-exchangeサイドカー)も同じSPIFFE IDで
    # 動く必要がある(JWT-SVID取得のため。fraud-mcp-server(ADR 0019)と同じ理由)。
    echo "==> fraud-agent entry (token-exchange container only)"
    create_if_missing_by_selectors "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/fraud-agent" \
      k8s:ns:gekko k8s:sa:default k8s:pod-label:app:fraud-agent k8s:container-name:token-exchange

    echo "==> frontend entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/frontend" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/frontend" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:frontend \
      -selector k8s:container-name:envoy

    # ADR 0024: ログイン(ROPC)・Token Exchange実行主体(token-exchangeサイドカー)も同じ
    # SPIFFE IDで動く必要がある(JWT-SVID取得のため。fraud-mcp-server(ADR 0019)と同じ理由)。
    echo "==> frontend entry (token-exchange container only)"
    create_if_missing_by_selectors "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/frontend" \
      k8s:ns:gekko k8s:sa:default k8s:pod-label:app:frontend k8s:container-name:token-exchange

    echo "==> edge-proxy entry (envoy container only)"
    create_if_missing "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/edge-proxy" \
      -parentID "$NODE_ALIAS_ID" \
      -spiffeID "spiffe://${TRUST_DOMAIN}/ns/gekko/sa/default/edge-proxy" \
      -selector k8s:ns:gekko \
      -selector k8s:sa:default \
      -selector k8s:pod-label:app:edge-proxy \
      -selector k8s:container-name:envoy

    echo "==> registration entries done"
