# fraud-mcp-serverの本実装Deployment(Python/FastMCP。ADR 0002/0007/0009/0010/0029)。
# hostAliasesで"account-service"を127.0.0.1へ静的にマッピングし、アプリが実サービス名・実APIパスで
# 普通にHTTPリクエストを組み立てるだけで、同一Pod内のEnvoy(egress)が横取りする(ADR 0010)。
#
# ADR 0019：Token Exchange実行主体を共有のext-authz-serviceからこのPod内の
# token-exchangeサイドカーへ移した。"keycloak"も127.0.0.1へマッピングし、
# token-exchangeサイドカー自身のKeycloak向けリクエストも同一Envoyのegressリスナーで
# mTLS化される(k8s/ext-authz/deployment.yamlが持っていたのと同じhostAliasesパターン)。
#
# ADR 0023：fraud-agent→fraud-mcp-serverホップの実装にあわせてEnvoyへingressリスナーを
# 追加した。fraud-mcp-serverはaccount-serviceに続き、ingress/egress両方を持つサービスになった。
#
# ADR 0029：appコンテナをPythonスタブ(ConfigMap embedded script)からservices/fraud-mcp-server/
# のFastMCP本実装(Makefileのbuild-fraud-mcp-serverターゲットでビルドし`k3d image import`で
# クラスタへ持ち込む)へ置き換えた。token-exchange/envoyサイドカーは無変更(account-service等の
# 実装済みサービスと同じくConfigMap embedded scriptのまま)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-mcp-server
  namespace: gekko
  labels:
    app: fraud-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-mcp-server
  template:
    metadata:
      labels:
        app: fraud-mcp-server
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["account-service", "keycloak"]
      initContainers:
        - name: handshake-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - "head -c32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /handshake/token"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
        # ネイティブsidecar(restartPolicy: Always。K8s 1.29+でGA、ADR 0028のdb-init Jobと同じ
        # パターン)。fraud-mcp-server自身はPostgresを持たないためwait-for-X initContainerは
        # 不要だが、account-service/analyst-attribute-service/keycloak/fraud-detection-engineと
        # 構成を揃えるため、通常のcontainersからここへ昇格した(Serviceのtargetport(http)解決・
        # NetworkPolicyのポートマッチングはcontainersと同様に機能する)。
        - name: envoy
          restartPolicy: Always
          image: envoyproxy/envoy:v1.31.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HANDSHAKE_TOKEN="$(cat /handshake/token)"
              exec envoy -c /etc/envoy/envoy.yaml
          ports:
            # ADR 0023:ingressリスナー(fraud-agentからの着信)。
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: handshake
              mountPath: /handshake
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      containers:
        - name: app
          image: gekko07/fraud-mcp-server:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_BIND_HOST
              value: "127.0.0.1"
            - name: APP_PORT
              value: "9000"
            - name: HANDSHAKE_TOKEN_FILE
              value: "/handshake/token"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service/"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        # ADR 0019: Token Exchange実行主体。envoyコンテナと同じくWorkload API UDSソケットへ
        # アクセスする(JWT-SVID取得のため)。SPIRE registration entryもenvoyコンテナと並んで
        # このコンテナ名をselectorに持つ(k8s/spire/entries-configmap.yaml参照)。
        - name: token-exchange
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: CLIENT_ID
              value: "fraud-mcp-server"
            - name: JWT_SVID_AUDIENCE
              value: "http://localhost:3000/realms/gekko"
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "9002"
            - name: KEYCLOAK_TOKEN_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/token"
          volumeMounts:
            - name: token-exchange-app-script
              mountPath: /scripts
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Kubernetes ImageVolume(1.33+ Beta)でspire-agentイメージから`spire-agent`
            # CLIバイナリだけを読み取り専用マウントする。distroless系イメージでシェルが
            # 無くコピーもできないため(実機確認済み)、grpcio等の新規Python依存を増やさずに
            # 済むこの方式を採用した(ADR 0019)。
            - name: spire-agent-bin
              mountPath: /spire-bin
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: token-exchange-app-script
          configMap:
            name: fraud-mcp-server-token-exchange-app
        - name: envoy-config
          configMap:
            name: fraud-mcp-server-envoy
        - name: handshake
          emptyDir: {}
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spire-agent-bin
          image:
            reference: ghcr.io/spiffe/spire-agent:1.15.3
