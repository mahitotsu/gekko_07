# ADR 0018。
# ADR 0019：ext-authz-serviceへのegressを、Keycloakへの直接egress(mTLS、bundle endpoint
# ではなくトークンエンドポイント)に置き換えた。Token Exchange実行主体が同一Pod内の
# token-exchangeサイドカーへ移ったため(k8s/fraud-mcp-server/envoy-configmap.yaml参照)。
# ADR 0023：fraud-agentからのingressを許可した(それまでfraud-mcp-serverにはKubernetes Service
# 自体が無くingressの受け口が無いため、Egressのみを制御していた)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-mcp-server
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: fraud-mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fraud-agent
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
