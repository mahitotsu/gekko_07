# fraud-mcp-server egress側Envoy設定(ADR 0002/0010)。127.0.0.1の1リスナーで、hostAliases
# (deployment.yaml参照)により"account-service"宛てのリクエストを受け止め、ext_authz(HTTPモード)
# がToken Exchangeを行ってから実アップストリーム(K8s Service account-service)へ転送する。
#
# scopeはExtAuthzPerRouteのcontext_extensionsでは渡さない(gRPCモード限定でHTTPモードには
# 伝わらないため。ADR 0010訂正箇所参照)。ext_authzサービス自身が、Envoyが自動転送する
# Host/Path/Methodから表2の対応表でscopeを解決する。そのためこのroute_config自体は
# 宛先の振り分け(パスパターンごとに同じクラスタへ)だけを担い、scope解決ロジックを持たない。
#
# account_service_upstream・ext_authz_clusterの両方に、SPIRE発行のSVIDによるmTLS+ALPN h2を
# 追加する(account_service_upstreamはADR 0012、ext_authz_clusterはADR 0016でext-authz-service
# 自体にEnvoyサイドカーを追加したことに伴い追加)。ALPNは接続時のネゴシエーションにしか
# 影響しないため、実際にh2を話すにはtyped_extension_protocol_optionsで明示的に
# http2_protocol_optionsを設定する必要がある(設定しないとALPNの結果に関わらずクラスタは
# 既定のHTTP/1.1のまま)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-mcp-server-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    # SDS(SPIRE Agent Workload API)はxDSプロトコルの一種であり、DiscoveryRequestにnode識別子が
    # 要る(実機検証で判明:未設定だと"TlsCertificateSdsApi: node 'id' and 'cluster' are required"で
    # 起動時エラーになる。ADR 0012)。
    node:
      id: fraud-mcp-server-envoy
      cluster: fraud-mcp-server
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: account_service
                          domains: ["account-service"]
                          routes:
                            # 表2:POST /accounts/{id}/unfreeze-proposals -> account:propose
                            - match:
                                safe_regex:
                                  google_re2: {}
                                  regex: "^/accounts/[^/]+/unfreeze-proposals$"
                                headers:
                                  - name: ":method"
                                    string_match: { exact: "POST" }
                              route: { cluster: account_service_upstream }
                            # 表2:GET /accounts/{id}/** -> account:read(読み取り系はこの配下)
                            - match:
                                prefix: "/accounts/"
                              route: { cluster: account_service_upstream }
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://ext-authz-service.gekko.svc.cluster.local:8080"
                              cluster: ext_authz_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: account_service_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/account-service"
                  validation_context_sds_secret_config:
                    # "ROOTCA"はSPIRE Agent SDSの既定マジック名(default_bundle_name)。
                    # 信頼ドメイン名等の任意文字列を指定すると、SPIRE側はそれを特定の
                    # SPIFFE ID(フェデレーション用)へのリクエストと解釈し、該当エントリが
                    # 存在しないため"workload is not authorized for the requested identities"
                    # で拒否される(実機検証で判明。ADR 0012)。
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: account_service_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: account-service.gekko.svc.cluster.local, port_value: 8080 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        - name: ext_authz_cluster
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/ext-authz-service"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: ext_authz_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: ext-authz-service.gekko.svc.cluster.local, port_value: 8080 }
