# fraud-detection-engine自身のPod内でclient_credentialsトークン取得を実行するサイドカー(ADR 0020)。
# これまで共有のext-authz-service-cc(k8s/ext-authz/)がclient_secretを保持して代理で行っていたが、
# Keycloakが検証するmTLS接続の身元(ext-authz-service-cc自身のSPIFFE ID)と、主張するclient_id
# (fraud-detection-engineのもの)が一致しないという身元検証上のギャップがあった(ADR 0019と同種の
# 問題。docs/insights.md参照)。fraud-mcp-server(ADR 0019)で確立した是正パターンを
# client_credentialsグラントへ横展開する。Keycloakのclient_assertionによるクライアント認証は
# grant_typeに依存しない仕組みのため、同じ機構がそのまま使えることを実機で確認した
# (docs/architecture.mdの「実機未検証」事項を解消)。
#
# client_secretの代わりに、このPod自身のJWT-SVID(SPIRE発行)をclient_assertionとして使う
# (k8s/fraud-mcp-server/token-exchange-app-configmap.yamlと同じ仕組み)。
#
# fraud-detection-engineはaccount-serviceに対して常にaccount:freezeのみを持つ(ADR 0010パターン②:
# パスに依存しないワイルドカードルート1本でscopeを固定)ため、表2のようなパスパターンごとの
# scope解決ロジックは持たず、固定scopeを返すだけでよい。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-engine-client-credentials-app
  namespace: gekko
data:
  app.py: |
    import base64
    import http.server
    import json
    import os
    import socketserver
    import subprocess
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    TOKEN_URL = os.environ.get(
        "KEYCLOAK_TOKEN_URL",
        "http://keycloak/realms/gekko/protocol/openid-connect/token",
    )
    CLIENT_ID = os.environ.get("CLIENT_ID", "fraud-detection-engine")
    FIXED_SCOPE = os.environ.get("FIXED_SCOPE", "account:freeze")
    # JWT-SVIDのaudクレームに求める値。KeycloakのSPIFFE federated-jwt認証はaud/iss検証ではなく
    # sub(SPIFFE ID)とKeycloakクライアント属性jwt.credential.subの一致だけを見る(実機確認済み。
    # k8s/fraud-mcp-server/token-exchange-app-configmap.yaml参照)。
    JWT_SVID_AUDIENCE = os.environ.get("JWT_SVID_AUDIENCE", "http://localhost:3000/realms/gekko")
    SPIRE_AGENT_BIN = os.environ.get("SPIRE_AGENT_BIN", "/spire-bin/opt/spire/bin/spire-agent")
    SPIRE_SOCKET_PATH = os.environ.get("SPIRE_SOCKET_PATH", "/run/spire/sockets/agent.sock")
    LISTEN_HOST = os.environ.get("LISTEN_HOST", "127.0.0.1")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "9002"))


    def _b64url_decode(s):
        s += "=" * (-len(s) % 4)
        return base64.urlsafe_b64decode(s)


    _jwt_svid_cache = {"token": None, "expires_at": 0.0}


    def fetch_jwt_svid():
        # SPIRE発行JWT-SVIDの既定TTLは短い(実機で5分)ため、期限手前で切り上げて再取得する。
        now = time.monotonic()
        if _jwt_svid_cache["token"] and now < _jwt_svid_cache["expires_at"]:
            return _jwt_svid_cache["token"]
        out = subprocess.run(
            [
                SPIRE_AGENT_BIN, "api", "fetch", "jwt",
                "-audience", JWT_SVID_AUDIENCE,
                "-output", "json",
                "-socketPath", SPIRE_SOCKET_PATH,
            ],
            capture_output=True, timeout=5, check=True,
        )
        body = json.loads(out.stdout)
        token = body[0]["svids"][0]["svid"]
        payload = json.loads(_b64url_decode(token.split(".")[1]))
        _jwt_svid_cache["token"] = token
        _jwt_svid_cache["expires_at"] = now + max(payload["exp"] - payload["iat"] - 10, 5)
        return token


    _cc_token_cache = {"token": None, "expires_at": 0.0}


    def get_client_credentials_token(scope):
        # 取得したKeycloakアクセストークン自体のキャッシュ(JWT-SVIDのキャッシュとは別レイヤー。
        # k8s/ext-authz/app-configmap.yamlの同名関数と同じ考え方)。
        now = time.monotonic()
        if _cc_token_cache["token"] and now < _cc_token_cache["expires_at"]:
            return _cc_token_cache["token"]
        data = urllib.parse.urlencode(
            {
                "grant_type": "client_credentials",
                "client_id": CLIENT_ID,
                "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-spiffe",
                "client_assertion": fetch_jwt_svid(),
                "scope": scope,
            }
        ).encode()
        req = urllib.request.Request(
            TOKEN_URL, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"}
        )
        with urllib.request.urlopen(req, timeout=5) as resp:
            body = json.loads(resp.read())
        _cc_token_cache["token"] = body["access_token"]
        _cc_token_cache["expires_at"] = now + max(int(body.get("expires_in", 60)) - 10, 5)
        return _cc_token_cache["token"]


    class Handler(http.server.BaseHTTPRequestHandler):
        def deny(self, code, msg):
            print(f"DENY {code}: {msg}", file=sys.stderr, flush=True)
            self.send_response(code)
            self.end_headers()

        def do_check(self):
            # 呼び出し元(fraud-detection-engine自身)は委任チェーン外のためsubject_tokenを
            # 持たず、Authorizationヘッダーはそもそも送られてこない(ADR 0010パターン②)。
            host = self.headers.get("Host")
            method = self.headers.get("Method") or self.command
            path = self.headers.get("Path") or self.path

            if not host:
                self.deny(400, "missing host")
                return
            try:
                token = get_client_credentials_token(FIXED_SCOPE)
            except urllib.error.HTTPError as e:
                self.deny(403, f"client_credentials rejected: {e.code} {e.read()!r}")
                return
            except Exception as e:  # noqa: BLE001 - 最小限のサイドカーなので広く捕捉してfail closeする
                self.deny(403, f"client_credentials failed: {e!r}")
                return

            print(f"ALLOW(client_credentials) {method} {path} aud={host} scope={FIXED_SCOPE}", flush=True)
            self.send_response(200)
            self.send_header("Authorization", f"Bearer {token}")
            self.end_headers()

        do_GET = do_check
        do_POST = do_check
        do_PUT = do_check
        do_DELETE = do_check

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        srv = Server((LISTEN_HOST, LISTEN_PORT), Handler)
        print(f"client-credentials sidecar listening on {LISTEN_HOST}:{LISTEN_PORT}", flush=True)
        srv.serve_forever()
