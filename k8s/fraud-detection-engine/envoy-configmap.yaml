# fraud-detection-engine egress側Envoy設定(ADR 0002/0010パターン②)。127.0.0.1の1リスナーで、
# hostAliases(deployment.yaml参照)により"account-service"宛てのリクエストを受け止め、
# ext_authz(client_credentials専用インスタンス。k8s/ext-authz/deployment-client-credentials.yaml)
# がclient_credentialsでトークンを取得してから実アップストリーム(K8s Service account-service)へ
# 転送する。
#
# fraud-detection-engineはaccount-serviceに対して常にaccount:freezeのみを持つ
# (ADR 0010表:「パスに依存しないワイルドカードルート1本でscopeを固定」)ため、frontend/
# fraud-mcp-server向けのようなパスパターンごとのルート分岐は不要。
#
# account_service_upstreamクラスタのみ、SPIRE発行のSVIDによるmTLS+ALPN h2を追加する
# (ADR 0015。fraud-mcp-server→account-serviceと同じ構成をこのホップへ横展開し、account-service
# 側のplaintext受け口を完全に撤廃した)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-engine-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    # SDS(SPIRE Agent Workload API)はxDSプロトコルの一種であり、DiscoveryRequestにnode識別子が
    # 要る(ADR 0012の実機検証で判明)。
    node:
      id: fraud-detection-engine-envoy
      cluster: fraud-detection-engine
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: account_service
                          domains: ["account-service"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: account_service_upstream }
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://ext-authz-service-cc.gekko.svc.cluster.local:8080"
                              cluster: ext_authz_cc_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: account_service_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/account-service"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: account_service_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: account-service.gekko.svc.cluster.local, port_value: 8080 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012/0015)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        - name: ext_authz_cc_cluster
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: ext_authz_cc_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: ext-authz-service-cc.gekko.svc.cluster.local, port_value: 8080 }
