# fraud-detection-engine egress側Envoy設定(ADR 0002/0010パターン②)。127.0.0.1の1リスナーで、
# hostAliases(deployment.yaml参照)により"account-service"宛てのリクエストを受け止め、
# ext_authzがclient_credentialsでトークンを取得してから実アップストリーム(K8s Service
# account-service)へ転送する。
#
# fraud-detection-engineはaccount-serviceに対して常にaccount:freezeのみを持つ
# (ADR 0010表:「パスに依存しないワイルドカードルート1本でscopeを固定」)ため、frontend/
# fraud-mcp-server向けのようなパスパターンごとのルート分岐は不要。
#
# ADR 0020：ext_authzの呼び出し先を、共有の`ext-authz-service-cc`(別Pod、mTLS要)から
# 同一Pod内のclient-credentialsサイドカー(127.0.0.1:9002、plaintext loopback。app_upstreamと
# 同じ信頼境界)へ変更した(ADR 0019のfraud-mcp-serverと同じ是正パターン)。client-credentials
# サイドカー自身がKeycloakへ発信する際はhostAliasesで"keycloak"を127.0.0.1へ横取りさせ、
# このEnvoyのegressリスナーでmTLS化する(keycloak_upstreamクラスタ。ext-authz-service-ccが
# 持っていたのと同じ構成をこのEnvoyへ統合した)。
#
# account_service_upstream・keycloak_upstreamの両方に、SPIRE発行のSVIDによるmTLS+ALPN h2を
# 追加する(account_service_upstreamはADR 0015、keycloak_upstreamはADR 0020でfraud-detection-engine
# 自身がKeycloakのmTLSポートへ直接接続するようになったことに伴い追加)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-engine-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    # SDS(SPIRE Agent Workload API)はxDSプロトコルの一種であり、DiscoveryRequestにnode識別子が
    # 要る(ADR 0012の実機検証で判明)。
    node:
      id: fraud-detection-engine-envoy
      cluster: fraud-detection-engine
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    # 監査ログ集約(ADR 0025)。fraud-detection-engineはingressリスナーを持たない
                    # (内部トリガーで動作するため)ため監査対象はこのegressのみ。jwt_authnも
                    # 無いためsub/scope/jtiは空文字列になる(Token Exchange自体の相関はKeycloakの
                    # イベントログ側で追う)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: account_service
                          domains: ["account-service"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: account_service_upstream }
                        # ADR 0020: client-credentialsサイドカー自身がKeycloakのトークン
                        # エンドポイントを叩く際の宛先(hostAliasesで"keycloak"を127.0.0.1へ
                        # 横取りしているため、ここへ着弾する)。http_filtersはリスナー全体に
                        # 適用されるため、このルートだけext_authzを無効化しないと、
                        # サイドカー自身のKeycloak宛て通信が自己参照的にext_authzへ回されて
                        # しまう(ADR 0019で判明した問題と同じ)。
                        - name: keycloak
                          domains: ["keycloak"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak_upstream }
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://127.0.0.1:9002"
                              cluster: client_credentials_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # ADR 0028: Postgres向けegress(hostAliasesで"postgres"を127.0.0.1へ横取り)。
        # PostgresはHTTPではないため、tcp_proxyフィルタのみの独立listenerにする。
        - name: postgres-egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 5432 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: postgres_tcp
                    cluster: postgres_upstream
      clusters:
        - name: account_service_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/account-service"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: account_service_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: account-service.gekko.svc.cluster.local, port_value: 8080 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012/0015)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        # ADR 0020: client-credentialsサイドカー(同一Pod、loopback)。app_upstreamと同じ
        # 信頼境界のためplaintextでよい(mTLS不要)。
        - name: client_credentials_cluster
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: client_credentials_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9002 }
        # ADR 0020: client-credentialsサイドカーがKeycloakのトークンエンドポイントへmTLSで
        # 直接接続する(旧ext-authz-service-ccが持っていたext_authz_cc_clusterと同じ構成)。
        - name: keycloak_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # ADR 0028: Postgresの mTLS終端Envoy(6432)へSPIRE発行のSVIDでmTLS接続する。
        - name: postgres_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/postgres"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: postgres_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: postgres.gekko.svc.cluster.local, port_value: 6432 }
