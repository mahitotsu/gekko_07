# ADR 0018。fraud-detection-engineにはKubernetes Service自体が無くingressの受け口が
# 無いため、Egressのみ制御する(ingressはdefault-denyのまま)。ADR 0020でclient_credentials
# トークン取得実行主体を自身のPod内サイドカーへ移したため、ext-authz-service-ccへの
# egressをKeycloakへのegressに置き換えた(ADR 0019のfraud-mcp-serverと同じ変更)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-detection-engine
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: fraud-detection-engine
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
