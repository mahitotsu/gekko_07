# ADR 0018。fraud-detection-engineにはKubernetes Service自体が無くingressの受け口が
# 無いため、Egressのみ制御する(ingressはdefault-denyのまま)。ADR 0020でclient_credentials
# トークン取得実行主体を自身のPod内サイドカーへ移したため、ext-authz-service-ccへの
# egressをKeycloakへのegressに置き換えた(ADR 0019のfraud-mcp-serverと同じ変更)。
# ADR 0027:自身のPostgresデータベースへのegressを追加した(appコンテナがEnvoyを介さず直接
# 接続する。account-service/analyst-attribute-serviceと同じパターン)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-detection-engine
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: fraud-detection-engine
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# ADR 0027:insights.mdに記録済みの実装漏れパターン(default-denyはPod単位でingress/egress
# 双方に適用されるため、接続元(db-init Job)側にも自分自身のegress許可ポリシーが要る)を
# account-service/analyst-attribute-serviceと同じ形で最初から適用する。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-detection-engine-db-init
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: fraud-detection-engine-db-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
