# fraud-detection-engineの本実装Deployment(Rust/Axum。ADR 0002/0007/0009/0010/0020/0027)。
# services.mdの通りfraud-detection-engineには着信(ingress)する経路が存在しない
# (account-serviceへ機械間認証で直接アクセスするのみ)ため、他の本実装サービスと異なり
# 合言葉initContainer・ingress用Envoyリスナーは持たない。appコンテナは自身のPostgres
# データベースに検知ルール・観測シグナルを持ち、バックグラウンドで定期的にスキャンして
# account-serviceへ凍結を依頼する(UC0)。127.0.0.1:9000の診断用ループバックAPI
# (GET /healthz・/detections)はセキュリティ境界外で、scripts/verify-hop.shがPod内から
# `kubectl exec`で直接叩く用途にのみ使う。
#
# ADR 0020：client_credentialsトークン取得の実行主体を共有のext-authz-service-ccからこのPod内の
# client-credentialsサイドカーへ移した(ADR 0019のfraud-mcp-serverと同じ是正パターン)。
# "keycloak"も127.0.0.1へマッピングし、client-credentialsサイドカー自身のKeycloak向け
# リクエストも同一Envoyのegressリスナーでmtls化される。EnvoyはADR 0028のdb-init Jobと同じ
# ネイティブsidecar(initContainers、restartPolicy: Always)として起動し、その後ろの
# wait-for-postgres initContainerがPostgres疎通を確認してからappを起動する。
#
# appコンテナのイメージはservices/fraud-detection-engine/のCargoプロジェクトをMakefileの
# build-fraud-detection-engineターゲットでビルドし、`k3d image import`でクラスタへ持ち込む
# (レジストリは使わない。account-service/analyst-attribute-serviceと同じADR 0026のパターン)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-engine
  namespace: gekko
  labels:
    app: fraud-detection-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection-engine
  template:
    metadata:
      labels:
        app: fraud-detection-engine
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["account-service", "keycloak", "postgres"] # ADR 0028: postgresを追加
      initContainers:
        # ネイティブsidecar(restartPolicy: Always。K8s 1.29+でGA、ADR 0028のdb-init Jobと同じ
        # パターン)。appコンテナより先に(SPIRE Workload APIからSVIDのSDS配信を受けて)起動・待受
        # させるため、通常のcontainersからここへ昇格した。account-service/analyst-attribute-
        # serviceと同じ実機不具合への対策。appコンテナ自身にもPostgres接続の30回リトライループ
        # (services/fraud-detection-engine/src/db.rs)があり今回は再現しなかったが、1回の接続試行
        # 自体がハングすると全リトライ予算を1回で使い切りかねない(analyst-attribute-serviceの
        # 30秒リトライループでも実際に4回クラッシュした実例がある)ため、アプリ側のリトライに
        # 頼らずここでも待つ。
        - name: envoy
          restartPolicy: Always
          image: envoyproxy/envoy:v1.31.5
          command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012/0015)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
        # 上のenvoy sidecarは起動さえすれば(SDS配信完了前でも)次のinitContainerへ進んでしまうため、
        # ここで実際にPostgres(Envoy egress→mTLS→postgres本体)への疎通が取れるまで待つ。
        # fraud-detection-engine-db-init(k8s/fraud-detection-engine/db-init-configmap.yaml)と
        # 同じリトライループ。
        - name: wait-for-postgres
          image: postgres:17.11
          command:
            - bash
            - -c
            - |
              for i in $(seq 1 30); do
                pg_isready -h postgres -U postgres >/dev/null 2>&1 && exit 0
                echo "postgres(Envoy mTLS経由)への接続待機中($i/30)..."
                sleep 1
              done
              echo "postgresへの接続待機がタイムアウトしました" >&2
              exit 1
      containers:
        - name: app
          image: gekko07/fraud-detection-engine:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_BIND_HOST
              value: "127.0.0.1" # ADR 0009 主対策①と同じ考え方:Pod外から直接到達不能にする
            - name: APP_PORT
              value: "9000"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service"
            - name: SCAN_INTERVAL_SECONDS
              value: "5"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "fraud_detection_engine"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fraud-detection-engine-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-detection-engine-db
                  key: password
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        # ADR 0020: client_credentialsトークン取得実行主体。envoyコンテナと同じくWorkload API
        # UDSソケットへアクセスする(JWT-SVID取得のため)。SPIRE registration entryもenvoy
        # コンテナと並んでこのコンテナ名をselectorに持つ(k8s/spire/entries-configmap.yaml参照)。
        - name: client-credentials
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: CLIENT_ID
              value: "fraud-detection-engine"
            - name: FIXED_SCOPE
              value: "account:freeze"
            - name: JWT_SVID_AUDIENCE
              value: "http://localhost:3000/realms/gekko"
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "9002"
            - name: KEYCLOAK_TOKEN_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/token"
          volumeMounts:
            - name: client-credentials-app-script
              mountPath: /scripts
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Kubernetes ImageVolume(1.33+ Beta)でspire-agentイメージから`spire-agent`
            # CLIバイナリだけを読み取り専用マウントする(ADR 0019と同じ理由。distroless系
            # イメージでシェルが無くコピーもできないため)。
            - name: spire-agent-bin
              mountPath: /spire-bin
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: envoy-config
          configMap:
            name: fraud-detection-engine-envoy
        - name: client-credentials-app-script
          configMap:
            name: fraud-detection-engine-client-credentials-app
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spire-agent-bin
          image:
            reference: ghcr.io/spiffe/spire-agent:1.15.3
