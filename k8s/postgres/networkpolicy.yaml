# ADR 0018・0026・0027。接続元(実行中の本体+db-init Job)からのみ許可する。
# postgres自身は外向き接続をしないためegressは制御不要。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: gekko
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
        - podSelector:
            matchLabels:
              app: keycloak-db-init
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: account-service-db-init
        - podSelector:
            matchLabels:
              app: analyst-attribute-service
        - podSelector:
            matchLabels:
              app: analyst-attribute-service-db-init
        - podSelector:
            matchLabels:
              app: analyst-attribute-service-seed
        - podSelector:
            matchLabels:
              app: fraud-detection-engine
        - podSelector:
            matchLabels:
              app: fraud-detection-engine-db-init
      ports:
        - protocol: TCP
          port: 5432
