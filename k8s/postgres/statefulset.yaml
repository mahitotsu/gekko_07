# サービス横断で共有する1つのPostgreSQLインスタンス（ADR 0008）。サービスごとに
# 論理DB・ロールを分離し、物理インスタンスのみ共有する（ローカルのメモリ制約への対応）。
#
# このStatefulSetは特定サービスのDB・ロールを一切知らない（素の共有エンジンのみを提供する）。
# 各サービスが自分のDB・ロールを作る責務を持ち、そのプロビジョニング処理は各サービス自身の
# ディレクトリに置く（例：k8s/keycloak/db-init-job.yaml）。新しいサービスを追加する際も
# このファイルを触る必要はない。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gekko
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.11
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: POSTGRES_DB
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
