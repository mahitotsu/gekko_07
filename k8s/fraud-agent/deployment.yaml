# fraud-agentの最小スタブDeployment(frontend→fraud-agent→fraud-mcp-serverホップ検証用。
# ADR 0002/0009/0010/0023)。Service名・ラベルは本実装と同じ"fraud-agent"にする(ADR 0010 MUST:
# Keycloakクライアントid=K8s Service名=audience名を常に同一の文字列にする)。
# Deployment名は"fraud-agent-stub"とし、本実装完成時にこのDeploymentごと差し替える。
#
# Pod構成はinitContainer(合言葉生成)＋app＋Envoy＋token-exchangeの4者(account-service
# (architecture.md §3)と同型。ADR 0019/0020のパターンをtoken-exchangeサイドカーとして
# 最初から適用)。
#
# hostAliasesで"fraud-mcp-server"・"keycloak"を127.0.0.1へ静的にマッピングし、
# egressリスナー(fraud-agent-envoy ConfigMap参照)へappからのリクエストとtoken-exchange
# サイドカー自身のKeycloak向けリクエストを横取りさせる(account-service/fraud-mcp-serverと
# 同じADR 0010/0019パターン)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-agent-stub
  namespace: gekko
  labels:
    app: fraud-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-agent
  template:
    metadata:
      labels:
        app: fraud-agent
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["fraud-mcp-server", "keycloak"]
      initContainers:
        # ADR 0009 §2③:Pod内合言葉。initContainerの完了がメインコンテナ起動前に保証されるため、
        # 「先に生成、後で両方が読む」がレースコンディションなく書ける。
        - name: handshake-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - "head -c32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /handshake/token"
          volumeMounts:
            - name: handshake
              mountPath: /handshake
        # ネイティブsidecar(restartPolicy: Always。K8s 1.29+でGA、ADR 0028のdb-init Jobと同じ
        # パターン)。fraud-agentはPostgresを持たないためwait-for-X initContainerは不要だが、
        # account-service等と構成を揃えるため、通常のcontainersからここへ昇格した(Serviceの
        # targetport(http)解決・NetworkPolicyのポートマッチングはcontainersと同様に機能する)。
        - name: envoy
          restartPolicy: Always
          image: envoyproxy/envoy:v1.31.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HANDSHAKE_TOKEN="$(cat /handshake/token)"
              exec envoy -c /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: handshake
              mountPath: /handshake
              readOnly: true
            # SPIRE Agent Workload API(UDS)ソケット(ADR 0012)。appコンテナはマウントしない
            # (秘密鍵に触れるのはEnvoyのみ)。
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: APP_BIND_HOST
              value: "127.0.0.1" # ADR 0009 主対策①:Pod外から直接到達不能にする
            - name: APP_PORT
              value: "9000"
            - name: HANDSHAKE_TOKEN_FILE
              value: "/handshake/token"
          volumeMounts:
            - name: app-script
              mountPath: /scripts
              readOnly: true
            - name: handshake
              mountPath: /handshake
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        # frontend→fraud-agent→fraud-mcp-serverのToken Exchange実行主体。envoyコンテナと
        # 同じくWorkload API UDSソケットへアクセスする(JWT-SVID取得のため)。SPIRE registration
        # entryもenvoyコンテナと並んでこのコンテナ名をselectorに持つ(k8s/spire/entries-configmap.yaml
        # 参照。ADR 0019/0020/0021と同じパターン)。
        - name: token-exchange
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          env:
            - name: CLIENT_ID
              value: "fraud-agent"
            - name: FIXED_SCOPE
              value: "account:read"
            - name: JWT_SVID_AUDIENCE
              value: "http://localhost:3000/realms/gekko"
            - name: LISTEN_HOST
              value: "127.0.0.1"
            - name: LISTEN_PORT
              value: "9002"
            - name: KEYCLOAK_TOKEN_URL
              value: "http://keycloak/realms/gekko/protocol/openid-connect/token"
          volumeMounts:
            - name: token-exchange-app-script
              mountPath: /scripts
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Kubernetes ImageVolume(1.33+ Beta)でspire-agentイメージから`spire-agent`
            # CLIバイナリだけを読み取り専用マウントする(ADR 0019と同じ理由。distroless系
            # イメージでシェルが無くコピーもできないため)。
            - name: spire-agent-bin
              mountPath: /spire-bin
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: app-script
          configMap:
            name: fraud-agent-stub-app
        - name: token-exchange-app-script
          configMap:
            name: fraud-agent-token-exchange-app
        - name: envoy-config
          configMap:
            name: fraud-agent-envoy
        - name: handshake
          emptyDir: {}
        - name: spire-agent-bin
          image:
            reference: ghcr.io/spiffe/spire-agent:1.15.3
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
