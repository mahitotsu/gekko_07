# fraud-agentの最小スタブ(frontend→fraud-agent→fraud-mcp-serverホップ検証用。本実装は
# TypeScript/Claude Agent SDK、ADR 0007)。account-service-stub(k8s/account-service/app-configmap.yaml)
# と同型の最小起動時ロジック(loopback限定bind・接続元loopback再チェック・合言葉ヘッダー検証)。
#
# frontend→fraud-agentホップ検証のため、受け取った元のAuthorizationヘッダー(jwt_authnの
# forward: trueで保持されている)をそのまま自分のegressリスナー(127.0.0.1:80、hostAliasesで
# "fraud-mcp-server"を横取り)へ転送する処理を常に行う。egressのtoken-exchangeサイドカー
# (ADR 0023。ADR 0019/0020のパターンを最初からこのホップに適用したもの)がこのAuthorization
# ヘッダーをsubject_tokenとしてToken Exchangeし、fraud-mcp-server向けの新しいトークンへ
# 置き換える。
#
# 検証ロジックは環境によらず単一(テスト時だけ迂回するフラグは作らない。CWE-489、ADR 0009 §3)。
# 期待値の出どころ(合言葉ファイルのパス)だけを環境変数で設定可能にする。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-agent-stub-app
  namespace: gekko
data:
  app.py: |
    import http.server
    import json
    import os
    import socketserver
    import urllib.error
    import urllib.request

    BIND_HOST = os.environ.get("APP_BIND_HOST", "127.0.0.1")
    APP_PORT = int(os.environ.get("APP_PORT", "9000"))
    HANDSHAKE_HEADER = os.environ.get("HANDSHAKE_HEADER_NAME", "x-gekko-handshake")
    HANDSHAKE_FILE = os.environ.get("HANDSHAKE_TOKEN_FILE", "/handshake/token")
    FRAUD_MCP_SERVER_URL = os.environ.get(
        "FRAUD_MCP_SERVER_URL", "http://fraud-mcp-server/"
    )


    def call_fraud_mcp_server(authorization):
        if not authorization:
            return {"skipped": "no Authorization header on inbound request"}
        req = urllib.request.Request(
            FRAUD_MCP_SERVER_URL, headers={"Authorization": authorization}
        )
        try:
            with urllib.request.urlopen(req, timeout=5) as resp:
                return {"status": resp.status, "body": json.loads(resp.read())}
        except urllib.error.HTTPError as e:
            return {"status": e.code, "body": e.read().decode()}
        except Exception as e:  # noqa: BLE001 - スタブなので広く捕捉して可視化する
            return {"error": repr(e)}


    def is_loopback(addr):
        return addr in ("127.0.0.1", "::1")


    class Handler(http.server.BaseHTTPRequestHandler):
        def handle_one_request(self):
            # 多層防御②(ADR 0009):bindアドレスの設定に関係なく、接続元がloopbackでなければ拒否する。
            if not is_loopback(self.client_address[0]):
                self.send_response(403)
                self.end_headers()
                self.close_connection = True
                return
            return super().handle_one_request()

        def do_request(self):
            # 多層防御③(ADR 0009):合言葉ヘッダーを検証してから初めてx-auth-*ヘッダーを信用する。
            # 欠落・不一致はどちらも同じfail closeとして扱う。
            try:
                with open(HANDSHAKE_FILE) as f:
                    expected = f.read().strip()
            except OSError:
                expected = None
            got = self.headers.get(HANDSHAKE_HEADER)
            if not expected or not got or got != expected:
                self.send_response(403)
                self.end_headers()
                self.wfile.write(b"handshake verification failed")
                return

            body = json.dumps(
                {
                    "method": self.command,
                    "path": self.path,
                    "sub": self.headers.get("x-auth-sub"),
                    "scope": self.headers.get("x-auth-scope"),
                    "jti": self.headers.get("x-auth-jti"),
                    "fraud_mcp_server": call_fraud_mcp_server(
                        self.headers.get("Authorization")
                    ),
                }
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        do_GET = do_request
        do_POST = do_request
        do_PUT = do_request
        do_DELETE = do_request

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        srv = Server((BIND_HOST, APP_PORT), Handler)
        print(f"stub app listening on {BIND_HOST}:{APP_PORT}", flush=True)
        srv.serve_forever()
