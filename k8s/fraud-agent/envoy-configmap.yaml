# fraud-agentのingress+egress側Envoy設定(ADR 0009/0023/0030)。account-service
# (k8s/account-service/envoy-configmap.yaml、ingress/egress両方を持つ最初のサービス)を雛形に、
# 呼び出し元をfrontend一つに、rbacポリシーを単一scope(account:read)のワイルドカードルートへ
# 簡略化した(analyst-attribute-serviceのingressと同じ簡略化)。
#
# ingress:jwt_authn(署名・iss・aud=fraud-agent検証、クレームをx-auth-*ヘッダーへ)→
# rbac(account:read保有のみを要求)→lua(rbac通過後にのみ合言葉ヘッダーを付与。ADR 0009 §2③)→
# router。
#
# egress(80番):hostAliasesで"fraud-mcp-server"・"keycloak"・"anthropic-gateway"を127.0.0.1へ
# 横取りし、appからのリクエストとtoken-exchangeサイドカー自身のKeycloak向けリクエストの両方を
# このリスナーで受け止める(ADR 0019/0020と同じパターン)。"anthropic-gateway"はADR 0030で追加した
# Anthropic API向けの仮想ホスト(本リポジトリで初めてのクラスタ外行き先)。Token Exchange対象では
# ないためkeycloakルートと同じくext_authzを無効化するが、TLS自体はEnvoyが終端し実際の
# api.anthropic.comへ再接続する(anthropic_upstreamクラスタ参照。SPIFFE mTLSではなく通常の
# 公開CA検証)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-agent-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    # SDS(SPIRE Agent Workload API)はxDSプロトコルの一種であり、DiscoveryRequestにnode識別子が
    # 要る(実機検証で判明:未設定だと"TlsCertificateSdsApi: node 'id' and 'cluster' are required"で
    # 起動時エラーになる。ADR 0012)。
    node:
      id: fraud-agent-envoy
      cluster: fraud-agent
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: ["h2"]
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/frontend"
                      validation_context_sds_secret_config:
                        # "ROOTCA"はSPIRE Agent SDSの既定マジック名(default_bundle_name)。
                        # 信頼ドメイン名等の任意文字列を指定すると、SPIRE側はそれを特定の
                        # SPIFFE ID(フェデレーション用)へのリクエストと解釈し、該当エントリが
                        # 存在しないため"workload is not authorized for the requested identities"
                        # で拒否される(実機検証で判明。ADR 0012)。
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    # 監査ログ集約(ADR 0025)。sub/scope/jtiはjwt_authnがこのリクエストに
                    # 実ヘッダーとして注入済み(claim_to_headers)のため、access_logからも
                    # %REQ(...)%でそのまま参照できる。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: fraud_agent
                          domains: ["*"]
                          routes:
                            # ADR 0030:/chatはAG-UIプロトコルのSSEストリームを返す(実行時間が
                            # 不定長)。総時間の上限ではなく無活動時間の上限(idle_timeout)で
                            # 制御する。
                            - match: { prefix: "/" }
                              route: { cluster: app_upstream, timeout: 0s, idle_timeout: 300s }
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              issuer: "http://localhost:3000/realms/gekko"
                              audiences: ["fraud-agent"]
                              remote_jwks:
                                http_uri:
                                  uri: "https://keycloak.gekko.svc.cluster.local:8443/realms/gekko/protocol/openid-connect/certs"
                                  cluster: keycloak_jwks
                                  timeout: 5s
                                cache_duration: 300s
                              forward: true
                              claim_to_headers:
                                - header_name: "x-auth-sub"
                                  claim_name: "sub"
                                - header_name: "x-auth-scope"
                                  claim_name: "scope"
                                - header_name: "x-auth-jti"
                                  claim_name: "jti"
                          rules:
                            - match: { prefix: "/" }
                              requires: { provider_name: "keycloak" }
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              read:
                                permissions:
                                  - any: true
                                principals:
                                  - header: { name: "x-auth-scope", string_match: { contains: "account:read" } }
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              -- rbacの後に配置しているため、ここに到達するのはrbacを通過した
                              -- リクエストのみ(ADR 0009 §2③:素通りしたリクエストに付与しては
                              -- 意味がない)。
                              function envoy_on_request(request_handle)
                                local token = os.getenv("HANDSHAKE_TOKEN")
                                if token then
                                  request_handle:headers():replace("x-gekko-handshake", token)
                                end
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # frontend→fraud-agent→fraud-mcp-server向けegressリスナー(ADR 0019/0020と同じパターン)。
        # hostAliasesで"fraud-mcp-server"・"keycloak"を127.0.0.1へ横取りし、appからのリクエストと
        # token-exchangeサイドカー自身のKeycloak向けリクエストの両方をこのリスナーで受け止める。
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    # 監査ログ集約(ADR 0025)。egress側にjwt_authnは無いため、appがx-auth-*を
                    # 転送しない限りsub/scope/jtiは空文字列になる(Token Exchange自体の相関は
                    # Keycloakのイベントログ側で追う)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: fraud_mcp_server
                          domains: ["fraud-mcp-server"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: fraud_mcp_server_upstream }
                        # token-exchangeサイドカー自身がKeycloakのトークンエンドポイントを叩く際の
                        # 宛先。http_filtersはリスナー全体に適用されるため、このルートだけext_authz
                        # を無効化しないと、サイドカー自身のKeycloak宛て通信が自己参照的にext_authz
                        # へ回されてしまう(ADR 0019で判明した問題と同じ)。
                        - name: keycloak
                          domains: ["keycloak"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak_upstream }
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                        # ADR 0030:Anthropic API(Claude Agent SDK本体の呼び出し先)向け。
                        # keycloakルートと同じ理由でext_authz(Token Exchange)を無効化する
                        # (Anthropicはメッシュ外・Keycloak登録済みaudienceではないため、
                        # Token Exchangeの対象にならない)。appは`ANTHROPIC_BASE_URL=
                        # http://anthropic-gateway`(hostAliasesで127.0.0.1)を経由し、
                        # ここから先はEnvoyがTLSを終端して実際のapi.anthropic.comへ
                        # 再接続する(下のanthropic_upstreamクラスタ参照)。
                        - name: anthropic_gateway
                          domains: ["anthropic-gateway"]
                          routes:
                            # ADR 0030実機で判明した罠(insights.md参照):appは自分が接続した
                            # URLのホスト名("anthropic-gateway")をそのままHostヘッダーに送る。
                            # SNIは"api.anthropic.com"(下のanthropic_upstreamクラスタ設定)なのに
                            # Hostだけ食い違うと、Anthropic側が"421 Misdirected Request"で拒否する
                            # ことを確認した。host_rewrite_literalでHostヘッダーを実際の
                            # ホスト名へ書き換える。
                            #
                            # 実機で判明した罠その2:1回の会話ターンでAnthropic APIを複数回
                            # (ツール呼び出しを挟んで)呼ぶが、ツール実行・モデルの思考で間隔が
                            # 空くと、Anthropic側のエッジがHTTP/1.1のkeep-alive接続を先に
                            # 閉じてしまうことがある。Envoyがこれに気づかず使い回そうとすると
                            # "socket connection was closed unexpectedly"になることを確認した。
                            # retry_policyでreset系エラーを自動リトライすることで解消した
                            # (接続の使い回し自体は維持しつつ、失効した接続を掴んだ場合のみ
                            # 透過的に再試行する。空振りリクエストなので二重実行の心配は無い)。
                            #
                            # 実機で判明した罠その3(ADR 0038):このルートにtimeout/idle_timeoutの
                            # 明示指定が無かったため、Envoyの既定route timeout(15s)が適用されていた。
                            # 上のapp_upstreamルート(frontend→fraud-agent)と同じく、Anthropic呼び出し
                            # 自体が実行時間不定長(モデルの応答生成時間に依存)なので、固定timeoutでは
                            # なくidle_timeoutで制御する必要がある。既定の15sでは、まとまった量の
                            # テキストを生成する応答が"504 upstream request timeout"として打ち切られ、
                            # 直後のSDK内部のセッション再開試行も同じ理由で失敗し、最終的に
                            # "socket connection was closed unexpectedly"としてクライアントに露出して
                            # いた。
                            - match: { prefix: "/" }
                              route:
                                cluster: anthropic_upstream
                                host_rewrite_literal: api.anthropic.com
                                timeout: 0s
                                idle_timeout: 300s
                                retry_policy:
                                  retry_on: "reset,connect-failure,refused-stream"
                                  num_retries: 2
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://127.0.0.1:9002"
                              cluster: token_exchange_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: app_upstream
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: app_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9000 }
        - name: keycloak_jwks
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        # egressリスナーのアップストリーム(fraud-mcp-server、ADR 0023でingress活性化)。
        # SPIRE発行のSVIDによるmTLS+ALPN h2(fraud-mcp-server→account-serviceと同じ構成)。
        - name: fraud_mcp_server_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-mcp-server"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: fraud_mcp_server_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: fraud-mcp-server.gekko.svc.cluster.local, port_value: 8080 }
        # token-exchangeサイドカー(同一Pod、loopback)。app_upstreamと同じ信頼境界のため
        # plaintextでよい(mTLS不要。ADR 0019と同じ考え方)。
        - name: token_exchange_cluster
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: token_exchange_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9002 }
        # token-exchangeサイドカーがKeycloakのトークンエンドポイントへmTLSで直接接続する
        # (keycloak_jwksクラスタと宛先は同じだが、用途を分けて別クラスタにしてある。
        # ADR 0019のkeycloak_upstreamと同じ構成)。
        - name: keycloak_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # ADR 0030:egress:80のanthropic_gateway仮想ホストのアップストリーム。appは
        # ANTHROPIC_BASE_URL=http://anthropic-gateway(hostAliasesで127.0.0.1)経由の平文で
        # ここまで届き、EnvoyがここでTLSを終端して実際のapi.anthropic.com:443へ接続し直す
        # (account-service等への他クラスタと同型のUpstreamTlsContextだが、SPIFFE SDSではなく
        # システムのCAバンドルを使う点が異なる。Anthropicは信頼メッシュの外にある公開エンドポイント
        # のため)。
        #
        # 実機で判明した罠(insights.md参照):当初はappからEnvoyへTLSバイト列をそのまま素通しする
        # blind tcp_proxy(127.0.0.1:443の専用リスナー)を試したが、appとEnvoyの両方が
        # "api.anthropic.com"という同一のhostAliasesエントリ(Pod内の全コンテナで共有される)を
        # 見てしまい、Envoy自身のクラスタ名前解決が自分自身(127.0.0.1)を指してしまう自己参照
        # ループになった。内部サービス(account-service等)ではapp向けの短縮名とEnvoy向けのFQDN
        # (`*.svc.cluster.local`)が異なるためこの衝突は起きないが、Anthropicは公開ホスト名が
        # 1つしかないため同じ手が使えない。ANTHROPIC_BASE_URLで「app向けの別名」(anthropic-gateway)
        # を導入し、Envoy向けの本物のホスト名(api.anthropic.com)と分離することで解決した
        # (内部サービスの「短縮名 vs FQDN」パターンと同じ考え方)。
        - name: anthropic_upstream
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: api.anthropic.com
              # ADR 0030実機で判明した罠(insights.md参照):h2をALPNへ含めると、Anthropic側が
              # h2を選択した際にEnvoyのHTTP層(このクラスタにはtyped_extension_protocol_optionsで
              # http2_protocol_optionsを明示していないため既定でHTTP/1.1コーデックのまま)との
              # 不一致で"reset reason: protocol error"になることを確認した。downstream側
              # (egress:80リスナー)もHTTP/1.1のため、http/1.1のみに絞ることで解消した。
              common_tls_context:
                alpn_protocols: ["http/1.1"]
                validation_context:
                  trusted_ca:
                    filename: /etc/ssl/certs/ca-certificates.crt
          load_assignment:
            cluster_name: anthropic_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: api.anthropic.com, port_value: 443 }
