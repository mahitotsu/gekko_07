# fraud-agent ingress+egress側Envoy設定(frontend→fraud-agent→fraud-mcp-serverホップ検証用。
# ADR 0009/0023)。account-service(k8s/account-service/envoy-configmap.yaml、ingress/egress
# 両方を持つ最初のサービス)を雛形に、呼び出し元をfrontend一つに、rbacポリシーを単一scope
# (account:read)のワイルドカードルートへ簡略化した(analyst-attribute-serviceのingressと
# 同じ簡略化)。
#
# ingress:jwt_authn(署名・iss・aud=fraud-agent検証、クレームをx-auth-*ヘッダーへ)→
# rbac(account:read保有のみを要求)→lua(rbac通過後にのみ合言葉ヘッダーを付与。ADR 0009 §2③)→
# router。
#
# egress:hostAliasesで"fraud-mcp-server"・"keycloak"を127.0.0.1へ横取りし、appからの
# リクエストとtoken-exchangeサイドカー自身のKeycloak向けリクエストの両方をこのリスナーで
# 受け止める(ADR 0019/0020と同じパターン)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-agent-envoy
  namespace: gekko
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    # SDS(SPIRE Agent Workload API)はxDSプロトコルの一種であり、DiscoveryRequestにnode識別子が
    # 要る(実機検証で判明:未設定だと"TlsCertificateSdsApi: node 'id' and 'cluster' are required"で
    # 起動時エラーになる。ADR 0012)。
    node:
      id: fraud-agent-envoy
      cluster: fraud-agent
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: ["h2"]
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              exact: "spiffe://gekko.internal/ns/gekko/sa/default/frontend"
                      validation_context_sds_secret_config:
                        # "ROOTCA"はSPIRE Agent SDSの既定マジック名(default_bundle_name)。
                        # 信頼ドメイン名等の任意文字列を指定すると、SPIRE側はそれを特定の
                        # SPIFFE ID(フェデレーション用)へのリクエストと解釈し、該当エントリが
                        # 存在しないため"workload is not authorized for the requested identities"
                        # で拒否される(実機検証で判明。ADR 0012)。
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    # 監査ログ集約(ADR 0025)。sub/scope/jtiはjwt_authnがこのリクエストに
                    # 実ヘッダーとして注入済み(claim_to_headers)のため、access_logからも
                    # %REQ(...)%でそのまま参照できる。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: fraud_agent
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: app_upstream }
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              issuer: "http://localhost:3000/realms/gekko"
                              audiences: ["fraud-agent"]
                              remote_jwks:
                                http_uri:
                                  uri: "https://keycloak.gekko.svc.cluster.local:8443/realms/gekko/protocol/openid-connect/certs"
                                  cluster: keycloak_jwks
                                  timeout: 5s
                                cache_duration: 300s
                              forward: true
                              claim_to_headers:
                                - header_name: "x-auth-sub"
                                  claim_name: "sub"
                                - header_name: "x-auth-scope"
                                  claim_name: "scope"
                                - header_name: "x-auth-jti"
                                  claim_name: "jti"
                          rules:
                            - match: { prefix: "/" }
                              requires: { provider_name: "keycloak" }
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              read:
                                permissions:
                                  - any: true
                                principals:
                                  - header: { name: "x-auth-scope", string_match: { contains: "account:read" } }
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              -- rbacの後に配置しているため、ここに到達するのはrbacを通過した
                              -- リクエストのみ(ADR 0009 §2③:素通りしたリクエストに付与しては
                              -- 意味がない)。
                              function envoy_on_request(request_handle)
                                local token = os.getenv("HANDSHAKE_TOKEN")
                                if token then
                                  request_handle:headers():replace("x-gekko-handshake", token)
                                end
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # frontend→fraud-agent→fraud-mcp-server向けegressリスナー(ADR 0019/0020と同じパターン)。
        # hostAliasesで"fraud-mcp-server"・"keycloak"を127.0.0.1へ横取りし、appからのリクエストと
        # token-exchangeサイドカー自身のKeycloak向けリクエストの両方をこのリスナーで受け止める。
        - name: egress
          address:
            socket_address: { address: 127.0.0.1, port_value: 80 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_http
                    # 監査ログ集約(ADR 0025)。egress側にjwt_authnは無いため、appがx-auth-*を
                    # 転送しない限りsub/scope/jtiは空文字列になる(Token Exchange自体の相関は
                    # Keycloakのイベントログ側で追う)。
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              sub: "%REQ(x-auth-sub)%"
                              scope: "%REQ(x-auth-scope)%"
                              jti: "%REQ(x-auth-jti)%"
                              upstream_host: "%UPSTREAM_HOST%"
                    route_config:
                      name: egress_route
                      virtual_hosts:
                        - name: fraud_mcp_server
                          domains: ["fraud-mcp-server"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: fraud_mcp_server_upstream }
                        # token-exchangeサイドカー自身がKeycloakのトークンエンドポイントを叩く際の
                        # 宛先。http_filtersはリスナー全体に適用されるため、このルートだけext_authz
                        # を無効化しないと、サイドカー自身のKeycloak宛て通信が自己参照的にext_authz
                        # へ回されてしまう(ADR 0019で判明した問題と同じ)。
                        - name: keycloak
                          domains: ["keycloak"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak_upstream }
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: "http://127.0.0.1:9002"
                              cluster: token_exchange_cluster
                              timeout: 5s
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: "authorization"
                          # ext_authzが不到達・異常時はfail close(既定でもfalseだが明示する)
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: app_upstream
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: app_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9000 }
        - name: keycloak_jwks
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
        # SPIRE Agent Workload API(UDS)へのSDSチャネル(ADR 0012)。
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: /run/spire/sockets/agent.sock }
        # egressリスナーのアップストリーム(fraud-mcp-server、ADR 0023でingress活性化)。
        # SPIRE発行のSVIDによるmTLS+ALPN h2(fraud-mcp-server→account-serviceと同じ構成)。
        - name: fraud_mcp_server_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/fraud-mcp-server"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: fraud_mcp_server_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: fraud-mcp-server.gekko.svc.cluster.local, port_value: 8080 }
        # token-exchangeサイドカー(同一Pod、loopback)。app_upstreamと同じ信頼境界のため
        # plaintextでよい(mTLS不要。ADR 0019と同じ考え方)。
        - name: token_exchange_cluster
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: token_exchange_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9002 }
        # token-exchangeサイドカーがKeycloakのトークンエンドポイントへmTLSで直接接続する
        # (keycloak_jwksクラスタと宛先は同じだが、用途を分けて別クラスタにしてある。
        # ADR 0019のkeycloak_upstreamと同じ構成)。
        - name: keycloak_upstream
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://gekko.internal/ns/gekko/sa/default/keycloak"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: keycloak_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.gekko.svc.cluster.local, port_value: 8443 }
